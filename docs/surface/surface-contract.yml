{
  "version": "oam.surface-contract.v1",
  "status": "current",
  "authority": "docs/oam/current-architecture.md",
  "operationRuntimePure": {
    "persistedWorkItemResolutionOrder": [
      "selected persisted WorkItem from operationWorkItems",
      "selected persisted WorkItem from workQueue",
      "case/workItem route identity",
      "block with operation_work_item_required"
    ],
    "forbiddenFallbackPaths": [
      "workspace.taskId",
      "card.workItemId when it is not persisted",
      "prepareCard in normal confirm path",
      "confirmCard in normal confirm path",
      "mobile retired write fallback"
    ],
    "primaryWritePath": "POST /api/operations/work-items/{workItemId}/confirm"
  },
  "completedBusinessRecord": {
    "viewPath": "direct readonly workspace record / fact trace without an intermediate completed-operation page",
    "surfaceShell": "shared Operations surface shell with OperationStepRail and direct OperationCardShell/card-operation readonly state",
    "forbiddenShell": "page-private detail shell, intermediate completed-operation page, copied completed-step-list layout, page-private outer wrapper, or completed-record-control visual wrapper",
    "correctionPath": "new OAM WorkItem with correctionMode=append_only",
    "actionOrder": ["create_active_work_item", "view_readonly_completed_record", "correct_append_only_from_record"],
    "dataSources": ["OperationsWorkItemConfirmed payload", "ProjectionEvent payload", "mobile completed-record read cache"],
    "correctionEntry": "only from readonly completed record after submitted values are visible",
    "forbiddenPath": "direct edit or repeat submit of the completed work item"
  },
  "currentSurfaceArchitecture": {
    "architecture": "oam.current surface system",
    "required": ["shared shell", "shared route guard", "shared named experience components", "surface contract", "direct OperationCardShell on step pages"],
    "forbidden": ["page-private shell", "intent-card operation wrapper", "copied layout logic", "old completed-record grid", "retired Workspace/Card write UI flow"],
    "repair": "rewrite non-current architecture onto the active surface architecture and delete obsolete implementation in the same impact scope"
  },
  "frontendExperienceSystem": {
    "contractRef": "docs/contracts/frontend-experience/frontend-experience-system-contract.json",
    "layers": ["shared-components", "field-context-kernel", "surface-contract", "multilingual-dictionary", "state-action-contract", "real-browser-evidence"],
    "rule": "pages may specialize business content but not architecture",
    "contentContainerRule": "ordinary mobile content must render as shared containers; business titles, status labels, anchors, explanations, and next-action copy must not appear as naked text on the page background",
    "businessSummaryCardHierarchy": "business item cards use BusinessSummaryHeader, structured non-clickable business anchors, BusinessTaskOverview, and a separate bottom action container",
    "searchMeResponsibilityBoundary": "Search is for active business discovery and entry; Me owns readonly personal history and support surfaces.",
    "fieldContextKernel": "field identity, aliases, task overview fields, option labels, and derived previews must come from apps/mobile/src/operationFieldKernel.js",
    "stepPageExperienceParity": "new active, readonly completed, and append-only correction step pages must share step rail, direct OperationCardShell, state/check panel, action hierarchy, feedback entry, and decision markers",
    "postSubmitNavigation": "successful active confirm must auto-advance to the next actionable persisted WorkItem in the same case when one exists",
    "stepStateVisualLanguage": "OperationStepRail status colors are semantic and must expose completed, ready, correction, in-progress, not-started, blocked, and current-step states"
  },
  "stepDependencySurface": {
    "contractRef": "docs/contracts/definition/step-dependency-contract.json",
    "requiredSurfaceTreatment": {
      "inheritedFields": "readonly context plus canonical hidden submit value",
      "userSelectableFields": "visible current-step control",
      "derivedFields": "system-generated preview plus canonical hidden submit value",
      "hiddenBackendDefaults": "not user-visible unless a backend blocker needs explanation"
    },
    "submitCheckDefault": "show only missing user action, blockers, and readiness",
    "submitCheckDetails": "collapse inherited, derived, hidden, material, and rule diagnostics unless they explain a blocker",
    "forbidden": ["page-local step dependency mapping", "manual input prompt for inherited fields", "manual input prompt for derived fields", "visible hidden-default fields"]
  },
  "admissionExplainabilitySurface": {
    "scope": ["mobile.search.resultCard", "mobile.operations.workItem.detail", "mobile.operations.workItem.confirm", "mobile.operations.workItem.receipt", "pc.governance.releaseState", "pc.governance.evidenceGraph"],
    "rule": "visibleAllowed, prepareAllowed, confirmAllowed, productionAllowed, mode, and safe reason copy must be consumed by the visible surface",
    "searchResultCard": {
      "visible": ["title", "subtitle", "statusLabel", "admissionLabel", "admissionReasonLabel", "nextAction"],
      "hiddenForOrdinaryUsers": ["admissionDecisionRef", "retiredAdapter", "definitionId", "payloadHash", "commandSubmissionId", "rawReason", "rawCode"],
      "confirmDeniedPrimaryAction": "view-only or learning action; never process/start-handling wording"
    },
    "operationWorkItemDetail": {
      "requiredTopStatus": ["admissionLabel", "mode", "confirmAllowed", "productionAllowed"],
      "readyStateRule": "only confirmAllowed=true may bind the submit action"
    },
    "safeErrorCopy": {
      "source": "Language Kernel key",
      "requiredKeys": ["operations.error.safe.403", "operations.error.safe.409", "operations.error.safe.422", "operations.error.safe.generic"],
      "forbidden": ["visible raw reason", "visible raw code", "direct result.message passthrough for blocked confirm"]
    }
  },
  "collaborationFeedback": {
    "surface": "feedback-message-channel",
    "entry": "right-bottom safe floating entry on mobile business surfaces",
    "messagePath": "mobile collaboration message with role/account recipient and current page/business context",
    "eventPath": "/api/mobile/client-events",
    "forbiddenPath": "Operations Confirm, business fact mutation, static placeholder-only feedback, duplicate local feedback buttons, or placement inside save/submit business action row"
  },
  "mobile": {
    "allowedSurfaces": ["home", "workbench", "search", "me", "workspace", "operationPanel", "learning", "notes", "reminders", "permissions", "businessRecords", "completedRecords", "evidenceLibrary", "uploadQueue", "submitQueue", "drafts", "failedSync", "recentSubmissions", "recentTraces", "deviceTrust", "feedback", "result", "confirmPage"],
    "allowedApiModules": ["apps/mobile/src/apiClient.js", "apps/mobile/src/operationRuntime.js"],
    "forbiddenPcSurfaces": ["releaseControl", "releaseFlightDeck", "pcGovernance", "governanceCenter", "financeControl", "financeReconciliation", "managerControlTower", "pcManager"],
    "forbiddenPcApiTokens": ["controlPlaneReleases", "observability", "bankStatementImport", "reconciliation", "correction", "behaviorEvents"]
  },
  "pc": {
    "allowedSurfaces": ["releaseControl", "releaseFlightDeck", "pcGovernance", "governanceCenter", "financeControl", "financeReconciliation", "managerControlTower", "pcManager"],
    "routeTree": "apps/mobile/src/pcRouteTree.js",
    "eventBinder": "apps/mobile/src/pcEventBinder.js",
    "apiModule": "apps/mobile/src/pcApiClient.js",
    "dataHydrator": "apps/mobile/src/pcSurfaceData.js"
  },
  "retiredWorkspaceCardWriteAdapter": {
    "allowedOnlyAs": "deleted",
    "normalConfirmPath": "forbidden",
    "adapterClass": "deleted"
  }
}
