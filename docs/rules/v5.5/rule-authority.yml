version: 1
id: v5.5-rule-authority
title: V5.5 Engineering Rules OS authority
precedenceOrder:
  - hardRules
  - releaseRules
  - engineeringRules
  - acceptanceRules
  - compatibilityRules
  - deprecatedRules
hardRules:
  - id: hard.no_business_batch_before_won18_green
    source: docs/engineering/00-rule-authority.md
    rule: P0 WON-18 gate evidence must be green before Mobile, Resource, Stay, Money, Deposit, or Checkout business work.
  - id: hard.no_page_specific_business_write_api
    source: docs/engineering/03-api-boundary-rules.md
    rule: Business writes must go through Operations Confirm; page-specific write APIs are P0.
  - id: hard.no_shadow_runtime_official_consumption
    source: docs/engineering/13-release-control-plane-rules.md
    rule: Official projectors must not consume shadow_runtime.
  - id: hard.no_manual_passed_gate_result
    source: docs/engineering/13-release-control-plane-rules.md
    rule: Passed GateResults must be generated by gate-runner and bound to CI evidence.
  - id: hard.issue_repair_protocol
    source: docs/engineering/00-rule-authority.md
    rule: Errors must be observed, impact-classified, layer-located, contract-aligned, rule/model-updated, root-cause fixed, and evidence-verified; page-level hard-adds and compatibility fallbacks are forbidden.
  - id: hard.unified_surface_architecture
    source: docs/engineering/00-rule-authority.md
    rule: All user-visible pages must use the active OAM-ACF v8 / Operations Runtime surface architecture, shared shell, shared route guards, and shared named experience components; non-current architecture must be root-cause rewritten and obsolete implementation deleted.
  - id: hard.frontend_experience_system
    source: docs/engineering/00-rule-authority.md
    rule: Frontend Experience System is mandatory for user-visible frontend work across shared components, Surface contract, multilingual dictionary, state/action contract, and real browser screenshot evidence; pages may specialize business content but not architecture, and old-architecture pages must be rewritten and deleted.
  - id: hard.responsibility_boundaries
    source: docs/engineering/00-rule-authority.md
    rule: Frontend controllers may orchestrate collection, submit, navigation, and sync, but must not own case-context resolution, field identity, validation policy, multilingual labels, or shared layout semantics when a current kernel exists; frontend pages render shared shells and controls but must delegate field source resolution, required/visible decisions, cross-step carry-forward, derived values, and submit-before-check missing-input decisions to FieldSourceRenderer and Definition/System Context contracts; backend command services must delegate branch resolution, ProcessManager dispatch decisions, field normalization, and projection materialization to named runtime collaborators rather than hiding compatibility writes or page-specific business logic.
  - id: hard.step_page_experience_parity
    source: docs/engineering/00-rule-authority.md
    rule: New active step, readonly completed step, and append-only correction step pages must share step rail, direct OperationCardShell, state/check panel, action hierarchy, feedback entry, and Admission/Runtime decision markers; page-private outer intent-card wrappers and readonly workspace-control visual wrappers are forbidden; users must not have to enumerate sibling pages one by one.
  - id: hard.post_submit_navigation
    source: docs/engineering/00-rule-authority.md
    rule: Successful active Operations WorkItem confirm must auto-advance to the next actionable persisted WorkItem in the same workspace when one exists; completed readonly records are explicit review or terminal fallback surfaces, and return-current-work must not be the ordinary continuation path after submit.
  - id: hard.step_state_visual_language
    source: docs/engineering/00-rule-authority.md
    rule: OperationStepRail must distinguish completed, ready, append-only correction, in-progress, not-started, and blocked states with stable semantic colors and machine-readable state markers; correction WorkItems must not display as ordinary ready blue, terminal completed records remain completed as the primary state when a correction marker exists, and current step requires a strong focus ring across new, readonly, and correction pages.
  - id: hard.resource_setup_bed_cardinality
    source: docs/engineering/00-rule-authority.md
    rule: ResourceSetup bedSetup must confirm room bed cardinality in one Operations WorkItem with roomId, bedCount, and bedLabels; bedType is a layout template and optional bedLayout may carry per-bed label/type expansion; bedStatus is only an initial status template defaulting to available, while maintenance/cleaning/not-for-sale changes must use roomReadiness or service task block/release flows; it must expand into one Bed fact per label, preserve each bed type, and room-beds block/release scope must apply to all beds in the room.
  - id: hard.service_task_resource_availability_scope
    source: docs/engineering/00-rule-authority.md
    rule: Maintenance, cleaning, or service work that blocks saleability must enter serviceTaskCreate with resourceScope and blocksAvailability=true, then release through roomReleaseAfterService with taskId, the matching resourceScope, and a backend-approved ServiceTaskVerified event for the same task; client-provided serviceTaskVerified is not proof, and ResourceSetup remains the only BedStatus/RoomStatus fact owner.
  - id: hard.step_dependency_carry_forward_contract
    source: docs/engineering/00-rule-authority.md
    rule: Later WorkItems in the same Operations case must declare inherited, user-selectable, system-derived, and hidden backend-default fields in Definition step dependency contracts; inherited fields are read-only surface values submitted as canonical hidden values, derived fields recompute from current inherited/user-selectable values, and stale drafts must not override upstream truth. Domain/sample field mappings must live in docs/contracts/definition/step-dependency-contract.json or a domain-specific Definition contract, not in global rule prose or page-local logic.
  - id: hard.submit_check_matches_step_dependency
    source: docs/engineering/00-rule-authority.md
    rule: Submit-before-check summaries must follow the step dependency contract; default visible copy shows only user-actionable missing inputs, blockers, and submission readiness, while inherited/derived/hidden technical checks stay collapsed unless they explain a blocker. Surfaces must not tell users to fill inherited, hidden, or system-derived fields unless upstream truth is missing.
  - id: hard.admission_explainability_surface
    source: docs/engineering/00-rule-authority.md
    rule: Search result cards, Operation WorkItem detail/confirm/receipt pages, and PC governance release/evidence pages must consume Admission/Language Kernel visibleAllowed, prepareAllowed, confirmAllowed, productionAllowed, mode, and safe reason copy; lifecycle ready/status labels must not imply confirm or Business Production readiness; confirmAllowed=false must not bind confirm or use process/start-handling wording; confirmAllowed=true with productionAllowed=false must be labeled as internal pilot observation or non-production confirmation; ordinary user surfaces must hide admissionDecisionRef, compatibilityAdapter, definitionId, payloadHash, commandSubmissionId, raw reason, and raw code; blocked/error copy must resolve through Language Kernel keys.
releaseRules:
  - id: release.v5_4_control_plane_transition
    source: docs/v5.4
    rule: V5.4 documents are control-plane bootstrap and transition rules.
  - id: release.v5_5_final_go_no_go
    source: docs/acceptance/13-v5.5-rules-os-go-no-go.md
    rule: Final V5.5 Go requires green CI, green V5.4 Guards, no P0 invariant failure, and no Red ShadowCompareReport.
engineeringRules:
  - id: engineering.rule_authority
    source: docs/engineering/00-rule-authority.md
    rule: New engineering work follows the Operations Runtime axis.
  - id: engineering.runtime_ownership
    source: docs/engineering/02-runtime-ownership-rules.md
    rule: Each business fact has a unique owner and non-owners must not write it directly.
  - id: engineering.api_boundary
    source: docs/engineering/03-api-boundary-rules.md
    rule: Every non-GET /api route must have exactly one write classification.
  - id: engineering.testing_ci
    source: docs/engineering/14-testing-ci-rules.md
    rule: P0 invariants must declare maturity, target maturity, deadline MR, and blocker policy.
  - id: engineering.surface_component_reuse
    source: docs/engineering/00-rule-authority.md
    rule: Surfaces may specialize data, permission, readonly state, and business actions, but must not keep a page-private legacy shell or outer intent-card operation wrapper when a current shared component exists.
  - id: engineering.frontend_experience_layers
    source: docs/contracts/frontend-experience/frontend-experience-system-contract.json
    rule: The five-layer Frontend Experience System contract binds shared components, Surface contracts, multilingual dictionaries, state/action contracts, and real-browser screenshot evidence to every user-visible page.
  - id: engineering.responsibility_boundaries
    source: scripts/check-responsibility-boundaries.mjs
    rule: Machine guards enforce that Operations controllers consume shared case-context and validation kernels, Workspace views consume FieldSourceRenderer for field-source decisions, and Canonical Operations Confirm delegates next-step branching to OperationBranchResolver.
acceptanceRules:
  - id: acceptance.index
    source: docs/acceptance/00-index.md
    rule: Missing machine evidence keeps the batch at NO-GO.
  - id: acceptance.v5_5_rules_os
    source: docs/acceptance/13-v5.5-rules-os-go-no-go.md
    rule: V5.5 Rules OS must generate a final Go/No-Go report before business batches resume.
compatibilityRules:
  - id: compatibility.architecture_docs
    source: docs/architecture
    rule: docs/architecture/* is compatibility reference and cannot override docs/rules/v5.5, docs/engineering, or docs/acceptance.
  - id: compatibility.workspace_card_api
    source: services/core-api/WorkOS.Api
    rule: Workspace/Card prepare and confirm write endpoints are retired and must stay deleted; Workspace/Card can only be projection/display compatibility input.
deprecatedRules:
  - id: deprecated.card_centric_primary_path
    source: legacy Workspace/Card/Confirm model
    rule: Workspace/Card/Confirm is not an allowed business write path for new or current dormitory operations.
  - id: deprecated.page_private_legacy_surface_shell
    source: legacy mobile page shells
    rule: Page-private legacy shells, deprecated record/detail grids, and copied layout logic are retired when a shared current architecture component exists.
machineChecks:
  - scripts/check-rule-authority.mjs
  - scripts/check-api-boundaries.mjs
  - scripts/check-experience-contract.mjs
  - scripts/check-surface-contract.mjs
  - scripts/check-frontend-experience-system.mjs
  - scripts/check-dormitory-field-context-contracts.mjs
  - scripts/check-responsibility-boundaries.mjs
  - scripts/check-fact-ownership.mjs
  - scripts/check-mr-contract.mjs
  - scripts/check-invariant-maturity.mjs
  - scripts/check-gate-result-hardening.mjs
  - scripts/check-rule-drift.mjs
  - scripts/check-v5-5-rules-os.mjs
