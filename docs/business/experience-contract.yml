  "ObjectWorkspaceIA": ["case-summary", "fact-trace", "lens", "audit"],
  "UnifiedSurfaceArchitecture": {
    "currentArchitecture": "OAM-ACF v8 / Operations Runtime surface architecture",
    "required": [
      "every user-visible page uses the active shared shell, route guard, surface contract, and named experience components",
      "new active, readonly completed, and append-only correction step pages render OperationCardShell directly without a page-private outer intent-card wrapper or workspace-control visual wrapper on readonly completed records",
      "readonly completed records reuse the Operations surface shell and shared step rail instead of a page-private legacy detail shell",
      "completed WorkItem routes and step-number clicks open the readonly completed record directly without an intermediate completed-operation page",
      "page variants may specialize data, permissions, readonly state, and business actions only"
    ],
    "retired": [
      "page-private legacy shell",
      "intent-card operation wrapper",
      "copied layout logic",
      "old completed-record-detail grid",
      "Workspace/Card write UI flow"
    ],
    "repair": "non-current architecture is a P0 defect and must be root-cause rewritten onto the current architecture with obsolete code deleted in the same impact scope"
  },
  "FrontendExperienceSystem": {
    "contractRef": "docs/contracts/frontend-experience/frontend-experience-system-contract.json",
    "layers": [
      "shared-components",
      "field-context-kernel",
      "surface-contract",
      "multilingual-dictionary",
      "state-action-contract",
      "real-browser-screenshot-evidence"
    ],
    "rule": "Pages may specialize business content, permissions, readonly state, and business actions, but not architecture; newly added or discovered old-architecture pages must be rewritten onto the current Frontend Experience System and the obsolete implementation deleted.",
    "mobileShellTitleRule": "ordinary mobile topbar owns the current page title, runtime status, and language selector; product brand and actor role must not occupy the first screen, and content sections must not repeat generic page titles",
    "contentContainerRule": "ordinary mobile content must render as shared overview containers, control containers, result groups, repeated item cards, or BusinessSummaryHeader; filter state, empty state, group headings, operation messages, completed-record groups, business titles, status labels, and next-action copy must not appear as naked text on the page background",
    "premiumSurfaceVisualLanguage": "mobile business surfaces use fresh premium visual tokens: bright teal-blue brand actions with lightweight primary-action gradients, soft white/neutral cards, subtle teal-tinted backgrounds, thin neutral borders, contained section headings, and lightweight status labels; bright orange is reserved for attention states such as due soon, waiting, or syncing; red is reserved for blockers, risk, or destructive states; static text such as headings, scenario titles, field values, status explanations, and next-action copy must not mimic buttons; only real clickable controls use filled or gradient button styling and restrained elevation; business summary ready states and ordinary metric chips may use small brand accents but must not use saturated blue/green blocks or bright green primary buttons",
    "premiumTypographySystem": "business surfaces must use a clear Chinese-first system UI font stack with Microsoft YaHei UI / Microsoft YaHei preferred on Windows, antialiased rendering, readable helper text sizes, and only light medium-weight titles/buttons; page-local bold/heavy weights and too-small 10px/11px ordinary copy are forbidden because they make Chinese mobile copy hard to read and low-end",
    "businessSummaryCardHierarchy": "business item cards across Today, Work items, Search, Me, and learning/support surfaces must place scenario title/status inside BusinessSummaryHeader, render room/bed/resident/phone/status anchors as structured non-clickable fields, render completed core fields and current-step core fields through BusinessTaskBody/BusinessTaskOverview, and keep the primary action in a bottom action container; business pages may specialize fields but not the layout hierarchy; risk, owner, due date, evidence diagnostics, and technical admission details are shown only when they explain a blocker or inside diagnostic details",
    "todayWorkResponsibilityBoundary": "Today owns a local focus list built only by selectTodayFocusQueue and data-today-filter; Today metric chips must not carry data-view=workbench or data-work-filter. Work owns the full permitted work queue via selectWorkbenchQueue, data-work-filter, scenario filters, and smart/due/risk/recent sorting.",
    "searchMeResponsibilityBoundary": "Search is the business discovery and entry surface for active commands, active WorkItems, and memorable business object anchors; personal archives such as business records, completed records, evidence materials, submission traces, and learning content belong in Me as readonly support surfaces and must not be dumped into ordinary search result sections.",
    "fieldContextKernel": "operation field identity, multilingual aliases, task overview field ordering, option display values, and derived previews must be owned by apps/mobile/src/operationFieldKernel.js; controllers must not import field identity from page views, and pages must not keep page-private alias maps or display-value rules",
    "businessAnchorDisplayRule": "business anchors must remain searchable as a full text string but user-facing cards should render structured fields such as room, bed, resident, phone, period, and current business status instead of one long concatenated sentence",
    "stepPageExperienceParity": "new active step, readonly completed step, and append-only correction step must share the same step rail, OperationCardShell, state/check panel, action hierarchy, feedback entry, and Admission/Runtime decision markers; they must not keep a page-private outer intent-card wrapper or workspace-control visual wrapper on readonly completed records; users must not have to enumerate every sibling page one by one",
    "postSubmitNavigation": "after a successful active Operations WorkItem confirm, auto-advance to the next actionable persisted WorkItem in the same workspace when one exists; completed readonly records are opened by explicit completed-step review or when no next actionable WorkItem exists; return-current-work is not the normal submit continuation path",
    "stepStateVisualLanguage": "OperationStepRail must expose data-step-state and data-current-step; completed is green, ready is blue, terminal completed records remain completed as the primary state even when a correction marker exists, active append-only correction WorkItems are muted indigo with a correction marker and must not display as ordinary ready blue, in-progress is amber, not-started is neutral gray, blocked is red, and current step has a clean focus ring across new, readonly, and correction pages; use subtle background tint, thin semantic top bar, and numbered badge instead of harsh saturated blocks",
    "requiredEvidence": "user-visible frontend fixes require real browser operation and full-page screenshot evidence"
  },
  "RuleScopeLayering": {
    "companyKernelRules": "architecture, ownership, permissions, evidence, surface behavior, multilingual behavior, and repair protocol that every business line must follow",
    "domainSampleRules": "business-specific semantics for an admitted or sample domain such as Accommodation / Dormitory",
    "scenarioInstanceContracts": "concrete WorkItem fields, step dependencies, evidence policies, UI labels, and validation mappings",
    "samplePurpose": "Dormitory is the golden sample used to extract reusable kernels for future business lines; concrete dormitory field names must stay in domain contracts, while reusable patterns are promoted only as abstract contracts."
  },
  "StepDependencyExperience": {
    "contractRef": "docs/contracts/definition/step-dependency-contract.json",
    "rule": "A step surface must render inherited fields as readonly context, user-selectable fields as the current interaction, derived fields as system output, and hidden backend defaults as non-user-visible contract values.",
    "submitCheckDefault": "Default visible submit checks show only user-actionable missing inputs, blockers, and submission readiness.",
    "submitCheckDetails": "Inherited, derived, hidden, material, and rule diagnostics are available as collapsed details or support/debug evidence only when they explain a blocker.",
    "forbidden": ["telling a user to fill inherited values", "showing hidden backend defaults as manual inputs", "letting stale drafts override upstream truth", "hard-coding a sample-domain field mapping into global surface logic"]
  },
  "AdmissionExplainabilityExperience": {
    "rule": "Admission state is user-facing truth for whether a visible item can be prepared, confirmed, or treated as production. Lifecycle labels such as ready, inProgress, or done are workflow state only and must not replace Admission.",
    "mobileSearch": "Search result cards must show a localized admission label and explanation. visibleAllowed=true means viewable only; it does not imply confirmAllowed or productionAllowed.",
    "operationPanel": "Operation pages must show top admission status before the form and primary action. confirmAllowed=false must not bind submit. confirmAllowed=true plus productionAllowed=false must be labeled as internal observation or non-production confirmation.",
    "safeErrors": "403, 409, 422, and generic confirm errors must resolve reasonCode through Language Kernel keys and must not append raw reason/code to ordinary user copy.",
    "ordinaryUserHidden": ["admissionDecisionRef", "compatibilityAdapter", "definitionId", "payloadHash", "commandSubmissionId", "raw reason", "raw code"]
  },
  "BusinessOperationActionPaths": {
    "create": "active work is created as an Operations WorkItem and confirmed only through POST /api/operations/work-items/{workItemId}/confirm",
    "postSubmit": "successful active confirm auto-advances to the next actionable persisted WorkItem when one exists; readonly completed record is not a mandatory detour",
    "operationFlowKernel": "next-step dispatch must be derived from the shared workspace/step seed or definition contract for every admitted scenario; page code and runtime code must not hard-code a single sample scenario such as W-STAY-RESOURCE as the only chain that can advance",
    "liveValidation": "active step submit checks must read the current operation draft values and refresh when user fields change; submit checks and backend confirm validation must use the same field-role contract",
    "view": "completed business records must open directly as readonly fact trace, submitted values, evidence, audit, and next-state context before any correction action is offered; an intermediate completed-operation page is forbidden",
    "correct": "completed facts are never edited in place; modification is append-only correction through a new Operations WorkItem or Correction Center request started from the readonly record",
    "order": ["create_active_work_item", "view_readonly_completed_record", "correct_append_only_from_record"],
    "forbidden": ["in-place edit of completed fact", "repeat confirm as modification", "page-specific update API", "intermediate completed-operation page"]
  },
  "IssueRepairProtocol": {
    "order": ["observe_real_behavior", "classify_impact_scope", "locate_broken_layer", "align_target_flow_to_contract", "update_rule_or_model", "implement_root_cause_fix", "verify_with_tests_and_real_browser"],
    "forbidden": ["page-level hard-add", "old compatibility fallback", "copy-only patch without model change", "direct edit of completed business fact"],
    "requiredWhen": ["duplicate UI", "blank completed record", "slow submit", "invalid business copy", "architecture mismatch", "field validation gap", "search or language mismatch"]
  },
  "FeedbackMessageChannel": {
    "mode": "role_or_account_addressed_collaboration_message",
    "entry": "right-bottom safe floating entry that opens feedback message channel without covering form fields or primary submit",
    "requiredContext": ["view", "actorRole", "workspace", "card", "workItem", "language", "deviceSurface"],
    "recipients": ["productDesign", "businessOwner", "systemSupport", "collaborationOwner"],
    "forbidden": ["static feedback placeholder only", "feedback writes business facts", "feedback uses Operations confirm", "floating entry covers submit or required fields", "feedback placed in save or submit business action row", "duplicate record-local feedback entry when shell feedback entry exists"]
  },
