{
  "version": "oma.experience-contract.v1",
  "authority": "docs/oma/current-architecture.md",
  "currentSurfaceArchitecture": {
    "name": "Operations Management Architecture surface system",
    "runtimeAxis": "Product Capability -> Domain Module -> WorkItem -> Confirm Runtime -> Unit of Work -> Event or Ledger -> Outbox -> Projection or Lens -> Surface",
    "required": [
      "shared shell",
      "shared route guard",
      "shared named experience components",
      "surface contract",
      "direct OperationCardShell on operation step pages"
    ],
    "forbidden": [
      "page-private shell",
      "copied layout logic",
      "page-private field source mapping",
      "retired Workspace/Card write UI flow",
      "completed record detour page"
    ],
    "repair": "any non-current surface is rewritten onto the OMA surface system and the obsolete implementation is deleted in the same scope"
  },
  "roleDefaultHome": {
    "frontdesk": "Today",
    "operator": "Today",
    "finance": "Finance Control",
    "housekeeping": "Work",
    "manager": "Manager Control Tower",
    "admin": "Governance Center",
    "releaseOwner": "Governance Center"
  },
  "roleNavigation": {
    "ordinaryMobile": ["Today", "Work", "Search", "Me"],
    "finance": ["Finance Control", "Work", "Search", "Me"],
    "manager": ["Manager Control Tower", "Work", "Search", "Me"],
    "admin": ["Governance Center", "Manager Control Tower", "Work", "Me"],
    "releaseOwner": ["Governance Center", "Work", "Me"]
  },
  "deviceSurfaceMatrix": {
    "mobile": ["Today", "Work", "Search", "Me"],
    "pc": ["Finance Control", "Manager Control Tower", "Governance Center"]
  },
  "frontendExperienceSystem": {
    "contractRef": "docs/contracts/frontend-experience/frontend-experience-system-contract.json",
    "layers": [
      "shared-components",
      "field-context-kernel",
      "surface-contract",
      "multilingual-dictionary",
      "state-action-contract",
      "real-browser-verification"
    ],
    "rule": "pages may specialize business content, permissions, readonly state, and business actions, but not architecture",
    "mobileShellTitleRule": "ordinary mobile topbar owns the current page title, runtime status, and language selector",
    "contentContainerRule": "ordinary mobile content renders in shared overview containers, control containers, result groups, repeated item cards, or BusinessSummaryHeader",
    "businessSummaryCardHierarchy": "business item cards use BusinessSummaryHeader, structured anchors, BusinessTaskOverview, and one primary action container",
    "todayWorkResponsibilityBoundary": "Today owns today's work only; Work owns the full permitted work queue",
    "searchMeResponsibilityBoundary": "Search is active business discovery; Me owns readonly personal archives and support surfaces",
    "fieldContextKernel": "field identity, aliases, task overview fields, option labels, and derived previews come from the shared field kernel",
    "stepPageExperienceParity": "new active, readonly completed, and append-only correction step pages share step rail, OperationCardShell, state/check panel, action hierarchy, feedback entry, and decision markers",
    "postSubmitNavigation": "successful active confirm advances to the next actionable persisted WorkItem in the same case when one exists",
    "stepStateVisualLanguage": "OperationStepRail exposes semantic states for completed, ready, correction, in progress, not started, blocked, and current step"
  },
  "workItemCard": {
    "required": ["workItemId", "caseId", "workItemType", "lifecycleState", "ownerRole", "SLA", "requiredEvidence", "nextAction", "traceRefs"],
    "visibleDefault": ["scenarioName", "businessAnchor", "completedCoreFields", "currentStepCoreFields", "status", "primaryAction"],
    "hiddenDefault": ["rawIds", "payloadHash", "commandSubmissionId", "technicalAdmissionDetails"]
  },
  "stepDependencyExperience": {
    "contractRef": "docs/contracts/definition/step-dependency-contract.json",
    "rule": "inherited fields are readonly context, user-selectable fields are current-step controls, derived fields are system previews, backend defaults stay hidden unless they explain a blocker",
    "submitCheckDefault": "show only missing user action, blockers, and readiness",
    "submitCheckDetails": "collapse inherited, derived, hidden, material, and rule diagnostics unless they explain a blocker",
    "forbidden": ["manual input prompt for inherited fields", "manual input prompt for system generated ids", "stale draft overriding upstream truth"]
  },
  "admissionExplainabilityExperience": {
    "rule": "visibleAllowed, prepareAllowed, confirmAllowed, productionAllowed, mode, and safe reason copy are consumed by the visible surface",
    "ordinaryUserHidden": ["admissionDecisionRef", "compatibilityAdapter", "definitionId", "payloadHash", "commandSubmissionId", "rawReason", "rawCode"],
    "safeErrors": ["operations.error.safe.403", "operations.error.safe.409", "operations.error.safe.422", "operations.error.safe.generic"]
  },
  "businessOperationActionPaths": {
    "create": "active work is created as an OMA WorkItem and confirmed only through POST /api/operations/work-items/{workItemId}/confirm",
    "view": "completed business records open directly as readonly fact trace, submitted values, evidence, audit, and next-state context",
    "correct": "completed facts are modified only by append-only correction through a new WorkItem or Correction Center request",
    "order": ["create_active_work_item", "view_readonly_completed_record", "correct_append_only_from_record"],
    "forbidden": ["in-place edit of completed fact", "repeat confirm as modification", "page-specific update API"]
  },
  "issueRepairProtocol": {
    "order": ["observe_real_behavior", "classify_impact_scope", "locate_broken_layer", "align_to_contract", "update_rule_or_model", "implement_root_cause_fix", "verify_with_tests_and_real_browser"],
    "forbidden": ["page-level hard-add", "old compatibility fallback", "copy-only patch without model change", "direct edit of completed business fact"]
  },
  "feedbackMessageChannel": {
    "mode": "role_or_account_addressed_collaboration_message",
    "entry": "right-bottom safe floating entry that opens feedback message channel without covering form fields or primary submit",
    "eventPath": "/api/mobile/client-events",
    "forbidden": ["feedback writes business facts", "feedback uses Operations Confirm", "feedback placed in save or submit business action row"]
  },
  "trustedConfirmSheet": {
    "content": ["workItemId", "caseId", "requiredEvidence", "policyRef", "idempotencyKey", "risk", "nextAction"]
  },
  "actionResultStateMatrix": {
    "committed_projected": "show success and trace refs",
    "committed_projection_pending": "show pending, not failed",
    "committed_projection_failed": "show support action, not duplicate submit",
    "permission_blocked_403": "show PermissionDiagnostic",
    "idempotency_conflict_409": "show duplicate submission result",
    "business_blocked_422": "show business blocker plus next action",
    "network_unknown": "show requires support"
  },
  "evidenceTileStateMatrix": {
    "missing": "blocks confirm",
    "draft": "can save draft",
    "attached": "can submit",
    "rejected": "blocks confirm",
    "wrong_scope": "blocks confirm"
  },
  "permissionDiagnosticCopyMatrix": {
    "403": {"zh-CN": "权限不足，请升级给负责人处理。", "ru-RU": "Недостаточно прав, передайте ответственному."},
    "409": {"zh-CN": "重复提交已被拦截，请查看原提交结果。", "ru-RU": "Дубликат остановлен, проверьте исходный результат."},
    "422": {"zh-CN": "业务条件未满足，请按下一步补齐。", "ru-RU": "Бизнес-условие не выполнено, выполните следующий шаг."}
  },
  "offlineEmptyErrorProjectionPendingStates": {
    "offline": "can save draft but cannot confirm",
    "empty": "show no assigned WorkItem",
    "error": "show support action",
    "projectionPending": "committed is not failed"
  },
  "bilingualOperationalCopyMatrix": {
    "Today": {"zh-CN": "今日", "ru-RU": "Сегодня"},
    "Work": {"zh-CN": "工作项", "ru-RU": "Задачи"},
    "Search": {"zh-CN": "搜索", "ru-RU": "Поиск"},
    "Me": {"zh-CN": "我的", "ru-RU": "Мой"},
    "Finance Control": {"zh-CN": "财务控制", "ru-RU": "Финансовый контроль"},
    "Manager Control Tower": {"zh-CN": "经理控制塔", "ru-RU": "Башня управления"},
    "Governance Center": {"zh-CN": "治理中心", "ru-RU": "Центр управления"}
  }
}
