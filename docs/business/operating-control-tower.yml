{
  "version": "rt6.operating-control-tower.v1",
  "stage": "RT-6",
  "nameZh": "经营控制塔",
  "summaryZh": "把宿舍 L1 Pilot 的指标、风险、任务、财务、证据、门禁和管理动作绑定成可运行的经营控制系统。",
  "statusBoundary": {
    "dormitoryLevel": "L1 Pilot",
    "dormitoryL2ProductionAllowed": false,
    "businessProductionAllowed": false,
    "repairLevel": "L0 Contract Preview",
    "partsLevel": "L0 Contract Preview",
    "hrLevel": "L0 Contract Preview"
  },
  "businessLineAdmissionGate": {
    "source": "docs/business/business-line-registry.json",
    "levels": ["L0 Contract Preview", "L1 Pilot", "L2 Production", "L3 Scaled Operation"],
    "l0Rules": {
      "productionConfirmAllowed": false,
      "productionLikeSurfaceAllowed": false,
      "readyOrBlockedCardsAllowed": false
    }
  },
  "operatingGoalTree": {
    "northStarMetric": "trusted_available_bed_nights",
    "metrics": [
      {
        "metricId": "salableBedNightConversionEfficiency",
        "nameZh": "可售床夜转化效率",
        "ownerRole": "Dormitory Operations Owner",
        "source": "DormAvailabilityLens + LeadFunnelLens",
        "workItemType": "Dorm.ReservationConfirm",
        "sla": "2h",
        "escalation": "Operations Director",
        "affectedFact": "Reservation",
        "requiredEvidence": ["reservation-acknowledgement"],
        "producedEvent": "Dormitory.ReservationConfirmed",
        "ledgerImpact": "none",
        "lens": "LeadFunnelLens",
        "audit": "CommandSubmission",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-001"
      },
      {
        "metricId": "checkinProcessingDuration",
        "nameZh": "入住办理时长",
        "ownerRole": "Front Desk Lead",
        "source": "StayOnboardingLens",
        "workItemType": "Dorm.CheckinConfirm",
        "sla": "30m",
        "escalation": "Dormitory Operations Owner",
        "affectedFact": "Stay",
        "requiredEvidence": ["identity-document", "checkin-confirmation"],
        "producedEvent": "Dormitory.StayCheckedIn",
        "ledgerImpact": "none",
        "lens": "StayOnboardingLens",
        "audit": "CommandSubmission",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-001"
      },
      {
        "metricId": "checkoutTurnoverDuration",
        "nameZh": "退住周转时长",
        "ownerRole": "Checkout Coordinator",
        "source": "CheckoutTurnoverLens",
        "workItemType": "Dorm.ResourceRelease",
        "sla": "4h",
        "escalation": "Operations Director",
        "affectedFact": "BedStatus",
        "requiredEvidence": ["cleaning-checklist", "settlement-clearance"],
        "producedEvent": "Dormitory.ResourceReleased",
        "ledgerImpact": "none",
        "lens": "CheckoutTurnoverLens",
        "audit": "FactTrace",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-005"
      },
      {
        "metricId": "serviceTaskCompletionDuration",
        "nameZh": "服务任务完成时长",
        "ownerRole": "Service Lead",
        "source": "ServiceTaskLens",
        "workItemType": "Dorm.ServiceTaskComplete",
        "sla": "4h",
        "escalation": "Operations Director",
        "affectedFact": "ServiceTask",
        "requiredEvidence": ["completion-photo", "verification-check"],
        "producedEvent": "Dormitory.ServiceTaskCompleted",
        "ledgerImpact": "none by default",
        "lens": "ServiceTaskLens",
        "audit": "CommandSubmission",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-004"
      },
      {
        "metricId": "unconfirmedPaymentAmount",
        "nameZh": "待确认收款金额",
        "ownerRole": "Finance Supervisor",
        "source": "RevenueCollectionLens",
        "workItemType": "Dorm.PaymentConfirm",
        "sla": "15m",
        "escalation": "Finance Controller",
        "affectedFact": "PaymentAllocation",
        "requiredEvidence": ["payment-receipt", "cashier-review"],
        "producedEvent": "Finance.PaymentConfirmed",
        "ledgerImpact": "balanced ordinary payment allocation",
        "lens": "StayBalanceLens",
        "audit": "LedgerTransaction",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-003"
      },
      {
        "metricId": "depositLiabilityAccuracy",
        "nameZh": "押金负债准确率",
        "ownerRole": "Finance Supervisor",
        "source": "DepositLiabilityLens",
        "workItemType": "Dorm.DepositConfirm",
        "sla": "15m",
        "escalation": "Finance Controller",
        "affectedFact": "DepositAccount",
        "requiredEvidence": ["receipt-proof", "deposit-policy"],
        "producedEvent": "Finance.DepositLiabilityConfirmed",
        "ledgerImpact": "balanced deposit liability transaction, not revenue",
        "lens": "DepositLiabilityLens",
        "audit": "LedgerTransaction",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-002"
      },
      {
        "metricId": "outstandingBalance",
        "nameZh": "欠款余额",
        "ownerRole": "Finance Supervisor",
        "source": "StayBalanceLens",
        "workItemType": "Dorm.ChargeGenerate",
        "sla": "same shift",
        "escalation": "Finance Controller",
        "affectedFact": "Charge",
        "requiredEvidence": ["charge-basis"],
        "producedEvent": "Finance.StayChargeBasisAccepted",
        "ledgerImpact": "charge receivable transaction",
        "lens": "StayBalanceLens",
        "audit": "LedgerTransaction",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-003"
      },
      {
        "metricId": "reconciliationExceptionRate",
        "nameZh": "对账异常率",
        "ownerRole": "Finance Controller",
        "source": "FinanceReconciliationLens",
        "workItemType": "Dorm.ExceptionResolve",
        "sla": "same day",
        "escalation": "General Manager",
        "affectedFact": "ExceptionCase",
        "requiredEvidence": ["exception-audit", "resolution-note"],
        "producedEvent": "Finance.ReconciliationExceptionRouted",
        "ledgerImpact": "correction only through append-only command",
        "lens": "ExceptionRiskLens",
        "audit": "RejectionTrace",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-006"
      },
      {
        "metricId": "evidenceMissingRate",
        "nameZh": "证据缺失率",
        "ownerRole": "Admin",
        "source": "EvidenceTrustLens",
        "workItemType": "Dorm.ExceptionResolve",
        "sla": "same day",
        "escalation": "Dormitory Operations Owner",
        "affectedFact": "EvidenceRequirement",
        "requiredEvidence": ["exception-audit"],
        "producedEvent": "Evidence.EvidenceBlockerCreated",
        "ledgerImpact": "none",
        "lens": "ExceptionRiskLens",
        "audit": "RejectionTrace",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-010"
      },
      {
        "metricId": "duplicateConfirmRate",
        "nameZh": "重复确认率",
        "ownerRole": "Runtime Owner",
        "source": "CommandSubmission",
        "workItemType": "Dorm.ExceptionResolve",
        "sla": "same day",
        "escalation": "Technical Owner",
        "affectedFact": "CommandSubmission",
        "requiredEvidence": ["exception-audit"],
        "producedEvent": "Runtime.IdempotencyConflictDetected",
        "ledgerImpact": "none; no duplicate ledger side effect",
        "lens": "ExceptionRiskLens",
        "audit": "CommandSubmission",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-009"
      },
      {
        "metricId": "blockedBedDays",
        "nameZh": "阻断床位天数",
        "ownerRole": "Resource Manager",
        "source": "DormAvailabilityLens",
        "workItemType": "Dorm.BedAvailabilityConfirm",
        "sla": "30m",
        "escalation": "Operations Director",
        "affectedFact": "BedStatus",
        "requiredEvidence": ["readiness-pass"],
        "producedEvent": "Dormitory.BedAvailabilityConfirmed",
        "ledgerImpact": "none",
        "lens": "DormAvailabilityLens",
        "audit": "FactTrace",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-004"
      },
      {
        "metricId": "overdueTaskCount",
        "nameZh": "超时任务数",
        "ownerRole": "Dormitory Operations Owner",
        "source": "WorkQueueLens",
        "workItemType": "Dorm.ExceptionResolve",
        "sla": "same day",
        "escalation": "General Manager",
        "affectedFact": "WorkItem",
        "requiredEvidence": ["exception-audit"],
        "producedEvent": "Operations.OverdueWorkItemEscalated",
        "ledgerImpact": "none",
        "lens": "WorkQueueLens",
        "audit": "WorkItemLifecycle",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-007"
      },
      {
        "metricId": "exceptionClosureRate",
        "nameZh": "异常闭环率",
        "ownerRole": "Operations Director",
        "source": "ExceptionRiskLens",
        "workItemType": "Dorm.ExceptionResolve",
        "sla": "same day",
        "escalation": "General Manager",
        "affectedFact": "ExceptionCase",
        "requiredEvidence": ["exception-audit", "resolution-note"],
        "producedEvent": "Operations.ExceptionResolved",
        "ledgerImpact": "correction only through append-only command",
        "lens": "ExceptionRiskLens",
        "audit": "FactTrace",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-008"
      },
      {
        "metricId": "slaAchievementRate",
        "nameZh": "SLA 达成率",
        "ownerRole": "Dormitory Operations Owner",
        "source": "WorkQueueLens",
        "workItemType": "Dorm.PeriodReview",
        "sla": "weekly",
        "escalation": "General Manager",
        "affectedFact": "LensReview",
        "requiredEvidence": ["period-review-pack"],
        "producedEvent": "Operations.SlaReviewCompleted",
        "ledgerImpact": "read-only ledger/projection review",
        "lens": "ManagementDashboardLens",
        "audit": "PeriodReview",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-007"
      },
      {
        "metricId": "periodActionCompletionRate",
        "nameZh": "周期行动完成率",
        "ownerRole": "Dormitory Operations Owner",
        "source": "PeriodReview",
        "workItemType": "Dorm.PeriodReview",
        "sla": "weekly",
        "escalation": "General Manager",
        "affectedFact": "ActionPlan",
        "requiredEvidence": ["period-review-pack"],
        "producedEvent": "Operations.PeriodActionPlanCompleted",
        "ledgerImpact": "read-only ledger/projection review",
        "lens": "ManagementDashboardLens",
        "audit": "PeriodReview",
        "factTraceRequired": true,
        "certificationScenario": "dorm-cert-007"
      }
    ]
  },
  "workItemOperatingModel": {
    "requiredFields": ["ownerRole", "sla", "escalation", "affectedFact", "requiredEvidence", "producedEvent", "ledgerImpact", "factTraceRequired", "certificationScenario"],
    "p0OperatingTasks": [
      "Dorm.ReservationConfirm",
      "Dorm.CheckinConfirm",
      "Dorm.PaymentConfirm",
      "Dorm.DepositConfirm",
      "Dorm.ServiceTaskComplete",
      "Dorm.ResourceRelease",
      "Dorm.ExceptionResolve",
      "Dorm.PeriodReview"
    ]
  },
  "riskCommandCenter": {
    "canGenerateWorkItem": true,
    "risks": [
      {"riskId":"risk-missing-evidence","ownerRole":"Admin","dueAtPolicy":"same day","recommendedAction":"补齐可信证据后重新提交","generatedWorkItemType":"Dorm.ExceptionResolve","relatedFactOrGate":"EvidenceRequirement"},
      {"riskId":"risk-payment-mismatch","ownerRole":"Finance Controller","dueAtPolicy":"same day","recommendedAction":"创建 FinanceCase 并走 append-only correction","generatedWorkItemType":"Dorm.ExceptionResolve","relatedFactOrGate":"LedgerTransaction"},
      {"riskId":"risk-bed-blocked","ownerRole":"Resource Manager","dueAtPolicy":"4h","recommendedAction":"派发清洁或维修 WorkItem 并复验床位","generatedWorkItemType":"Dorm.ServiceTaskComplete","relatedFactOrGate":"BedStatus"},
      {"riskId":"risk-sla-overdue","ownerRole":"Dormitory Operations Owner","dueAtPolicy":"same day","recommendedAction":"升级 owner 并记录 period review action","generatedWorkItemType":"Dorm.PeriodReview","relatedFactOrGate":"WorkItemLifecycle"}
    ]
  },
  "financeControlTower": {
    "amountFields": [
      {"field":"unconfirmedPaymentAmount","workItemRef":"Dorm.PaymentConfirm","evidenceRef":"payment-receipt","approverRef":"Finance Supervisor","ledgerRef":"LedgerTransaction","snapshotRef":"StayBalanceLens"},
      {"field":"depositLiabilityBalance","workItemRef":"Dorm.DepositConfirm","evidenceRef":"receipt-proof","approverRef":"Finance Supervisor","ledgerRef":"LedgerTransaction","snapshotRef":"DepositLiabilityLens"},
      {"field":"outstandingBalance","workItemRef":"Dorm.ChargeGenerate","evidenceRef":"charge-basis","approverRef":"Finance Supervisor","ledgerRef":"LedgerTransaction","snapshotRef":"StayBalanceLens"},
      {"field":"refundBlockedAmount","workItemRef":"Dorm.RefundApprove","evidenceRef":"refund-approval","approverRef":"Finance Controller","ledgerRef":"LedgerTransaction","snapshotRef":"DepositSettlementLens"}
    ]
  },
  "managerControlTower": {
    "visibleQueues": ["risk", "overdue", "evidence", "finance", "sync"],
    "actions": ["assignOwner", "setDueAt", "recommendAction", "trackSla", "verifyResult", "enterPeriodReview"]
  },
  "opxGoldenDomainControlBoard": {
    "machineSourceOnly": true,
    "sourceRefs": ["GateResult", "checkerOutput", "artifacts/rt4/evidence-graph.json", "artifacts/rt4/completion-dashboard.json"],
    "forbiddenSourceRefs": ["PR body", "manual PASS"]
  },
  "releaseFlightDeckAcceptancePanels": [
    {"panelId":"b-stage-gate","source":"GateResult","evidenceFile":".tmp/v5_4/b-stage-gate-result.json","owner":"Release Owner","nextAction":"阻断项清零后才允许下一阶段"},
    {"panelId":"control-plane","source":"GateResult","evidenceFile":".tmp/v5_4/gate-result.json","owner":"Release Owner","nextAction":"formal gate blocked 时不得 production"},
    {"panelId":"evidence-graph","source":"evidenceGraph","evidenceFile":"artifacts/rt4/evidence-graph.json","owner":"QA Owner","nextAction":"图不可验证时停止合并"},
    {"panelId":"checker-output","source":"checkerOutput","evidenceFile":"artifacts/rt4/completion-dashboard.json","owner":"Program Owner","nextAction":"dashboard 无 evidence refs 时停止"}
  ],
  "operatingRhythmCalendar": [
    {"cadence":"daily","meeting":"风险、超时、证据、财务、同步异常复盘","source":"Manager Control Tower"},
    {"cadence":"weekly","meeting":"PeriodReview 与行动完成率冻结","source":"Dorm.PeriodReview"}
  ],
  "launchDrillAndGoNoGo": {
    "reads": ["BStageGateResult", "RuntimeInvariantCheck", "ShadowCompareReport", "RollbackInstruction", "BusinessSignoff"],
    "missingRollbackBlocks": true,
    "redShadowBlocks": true
  },
  "trainingAndBehaviorFeedback": {
    "roles": ["frontdesk", "finance", "housekeeping", "manager", "admin", "releaseOwner"],
    "feedbackSources": ["CommandSubmission", "RejectionTrace", "WorkItemLifecycle", "EvidenceAudit"]
  },
  "repairL0IncubationRoadmap": {
    "level": "L0 Contract Preview",
    "productionAllowed": false,
    "nextGate": "Business Line Admission Gate"
  }
}
