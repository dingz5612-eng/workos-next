{
  "version": 1,
  "packId": "domain-pack-template",
  "domainId": "example.domain",
  "owner": "example.owner",
  "domainOwner": "example.owner",
  "ownedFacts": [],
  "requestedFacts": [],
  "events": ["ExampleDomainEvent"],
  "workitems": ["ExampleReviewWorkItem"],
  "evidence": {
    "required": ["exampleEvidenceObject"],
    "policy": "referenceOnly"
  },
  "finance": {
    "moneyBasisPolicy": "routeToFinanceTruthPack",
    "ledgerPolicy": "noDirectLedgerCommit"
  },
  "invariants": ["example.domain_pack_no_center_truth"],
  "certification": {
    "requiredScenarios": ["example-domain-certification"]
  },
  "goNoGo": {
    "productionAllowedDefault": false
  },
  "allowedCapabilities": ["propose", "validate", "project"],
  "forbiddenCapabilities": ["ownCenterTruth", "commitLedgerWithProvisionalRef", "processDomainExceptionFromManagementCockpit"],
  "receiptPolicy": "referenceOnly",
  "managementCockpitBoundary": "observeAndRouteOnly"
}
