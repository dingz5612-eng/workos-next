      Lens: readonly
      Projection: readonly
      Dashboard: readonly
    uiUxBoundary:
      currentWorkItemOnly: true
      readonlyCarryForward: true
      confirmPathOnly: true
      noInlineConfirm: true
    goNoGo:
      untilAllSatisfied: NO_GO
      finalDecisionOwner: artifacts/oam/final-report.json
  - packageId: service-task
    nameZh: 服务任务
    businessGoalZh: 对入住后的服务请求、分派、完成和核验形成可追踪工单链。
    inScope:
      - Dorm.ServiceTaskCreate
      - Dorm.ServiceTaskAssign
      - Dorm.ServiceTaskComplete
      - Dorm.ServiceTaskVerify
    outOfScope:
      - 财务入账
      - 支出审批
      - Dashboard 写事实
    mainFlowZh:
      - 服务请求创建
      - 服务任务分派
      - 服务完成
      - 服务核验
    branchFlows:
      - 请求描述缺失
      - 无负责人
      - 超时
      - 核验不通过
      - 返工
    fields:
      - fieldId: service.requestDetail
        displayNameZh: 服务请求说明
        type: text
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ServiceTaskCreate
        fallbackAllowed: false
        validationRules:
          - 必须说明服务对象和问题。
        evidenceRequirements:
          - service-request-proof
      - fieldId: service.completionProof
        displayNameZh: 服务完成证据
        type: evidenceRef
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ServiceTaskComplete
        fallbackAllowed: false
        validationRules:
          - 完成证据不能为空。
        evidenceRequirements:
          - service-completion-proof
    handoff:
      produces:
        - ServiceTask
        - EvidenceObject
      enablesNext:
        - expense-governance
        - period-review
      carryForwardReadonly:
        - service.requestDetail
        - service.completionProof
      nextAdmission: admission.dormitory.expense-governance.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 财务经办人
    factOwnership:
      allowedFacts:
        - ServiceTask
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
