  - packageId: exception-correction
    nameZh: 异常纠错
    businessGoalZh: 以 append-only 方式生成纠错工单和纠错事件，不覆盖已确认事实。
    inScope:
      - Dorm.ExceptionResolve
      - Finance.CorrectionApply
    outOfScope:
      - 覆盖原事实
      - 直接改账
      - Dashboard 写事实
    mainFlowZh:
      - 异常登记
      - 原事实和新事实绑定
      - 证据和审批确认
      - 纠错事件追加
    branchFlows:
      - 原事实缺失
      - 新事实缺失
      - 缺纠错原因
      - 缺审批
      - 财务纠错移交
    fields:
      - fieldId: correction.originalFactRef
        displayNameZh: 原事实引用
        type: factRef
        category: readonly-carry-forward
        editable: false
        source: handoff
        truthOwner: OriginalFactOwner
        fallbackAllowed: false
        validationRules:
          - 原事实只能引用，不能覆盖。
        evidenceRequirements:
          - original-fact-proof
      - fieldId: correction.newFactProposal
        displayNameZh: 新事实提议
        type: object
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ExceptionResolve
        fallbackAllowed: false
        validationRules:
          - 必须绑定纠错原因、证据和审批。
        evidenceRequirements:
          - correction-proof
      - fieldId: correction.approvalReason
        displayNameZh: 纠错审批理由
        type: text
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ExceptionResolve
        fallbackAllowed: false
        validationRules:
          - 审批理由不能为空。
        evidenceRequirements:
          - correction-approval-proof
    handoff:
      produces:
        - CorrectionWorkItem
        - CorrectionEvent
        - EvidenceObject
      enablesNext: []
      carryForwardReadonly:
        - correction.originalFactRef
        - correction.newFactProposal
        - correction.approvalReason
      nextAdmission: admission.dormitory.resource-saleability.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 非授权财务确认
    factOwnership:
      allowedFacts:
        - CorrectionWorkItem
        - CorrectionEvent
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
        - LedgerEntry
        - DashboardSummary 写入
        - 原事实覆盖
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.exception-correction.v1
      missingEvidenceOutcome: NO_GO
    ledger:
