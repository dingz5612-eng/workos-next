scenarioPackages:
  - packageId: resource-saleability
    nameZh: 资源可售
    businessGoalZh: 房间、床位、资源达到 L1 internal pilot 可售准备。
    inScope:
      - Dorm.RoomSetupConfirm
      - Dorm.BedSetupConfirm
      - Dorm.ResourceReadinessConfirm
    outOfScope:
      - 线索
      - 预订
      - 入住
      - 普通收款
      - 押金
      - 账务入账
      - 退住
      - Dashboard 写事实
      - Search 写事实
      - Surface 推断事实
    mainFlowZh:
      - 房间确认
      - 床位确认
      - 资源可售确认
    branchFlows:
      - 缺字段
      - 缺证据
      - 证据不可信
      - 重复房间
      - 床位归属错误
      - 资源不可售
      - 人工复核
      - 纠错
    fields:
      - fieldId: room.basicProfile
        displayNameZh: 房间基础信息
        type: object
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.RoomSetupConfirm
        fallbackAllowed: false
        validationRules:
          - 必须包含楼栋、房号、房型、可售状态。
        evidenceRequirements:
          - room-photo
      - fieldId: bed.roomBinding
        displayNameZh: 床位归属
        type: object
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.BedSetupConfirm
        fallbackAllowed: false
        validationRules:
          - 床位必须归属于已确认房间。
        evidenceRequirements:
          - room-link-proof
      - fieldId: resource.readinessState
        displayNameZh: 资源可售状态
        type: enum
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ResourceReadinessConfirm
        fallbackAllowed: false
        validationRules:
          - 只能由资源可售确认工单写入。
        evidenceRequirements:
          - verification-check
    handoff:
      produces:
        - Room
        - Bed
        - EvidenceObject
      enablesNext:
        - lead-reservation
      carryForwardReadonly:
        - room.basicProfile
        - bed.roomBinding
        - resource.readinessState
      nextAdmission: admission.dormitory.lead-reservation.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 财务经办人
    factOwnership:
      allowedFacts:
        - Room
        - Bed
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
        - Payment
        - Deposit
        - LedgerEntry
        - DashboardSummary 写入
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.resource-saleability.v1
      missingEvidenceOutcome: NO_GO
    ledger:
      policyRef: ledger.none.v1
      ledgerEntryAllowed: false
    readSideOutputs:
      SearchResult: readonly
      Lens: readonly
      Projection: readonly
      Dashboard: readonly
    uiUxBoundary:
      currentWorkItemOnly: true
      readonlyCarryForward: true
      confirmPathOnly: true
      noInlineConfirm: true
    goNoGo:
      untilAllSatisfied: NO_GO
      finalDecisionOwner: artifacts/oam/final-report.json
  - packageId: lead-reservation
    nameZh: 线索与预订
    businessGoalZh: 在资源只读上下文下记录线索、预订意向、保留期限和下一步动作。
    inScope:
      - Dorm.LeadCapture
      - Dorm.ReservationConfirm
    outOfScope:
      - 入住办理
      - 普通收款
      - 押金入账
      - Dashboard 写事实
      - Search 写事实
    mainFlowZh:
      - 线索登记
      - 预订确认
      - 预订到期处理
    branchFlows:
      - 缺联系方式
      - 资源已不可售
      - 重复预订
      - 保留期限过期
      - 取消预订
      - 转入住
    fields:
      - fieldId: lead.personContact
        displayNameZh: 客户联系方式
        type: object
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.LeadCapture
        fallbackAllowed: false
        validationRules:
          - 姓名和联系电话不能为空。
        evidenceRequirements:
          - contact-proof
      - fieldId: reservation.resourceIntent
        displayNameZh: 预订资源意向
        type: object
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ReservationConfirm
        fallbackAllowed: false
        validationRules:
          - 只能选择资源可售包产出的只读资源。
        evidenceRequirements:
          - reservation-intent-proof
      - fieldId: reservation.holdUntil
        displayNameZh: 保留截止时间
        type: datetime
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.ReservationConfirm
        fallbackAllowed: false
        validationRules:
          - 必须晚于当前提交时间。
        evidenceRequirements:
          - reservation-policy-proof
    handoff:
      produces:
        - Lead
        - Reservation
        - EvidenceObject
      enablesNext:
        - check-in
      carryForwardReadonly:
        - lead.personContact
        - reservation.resourceIntent
        - reservation.holdUntil
      nextAdmission: admission.dormitory.check-in.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 财务经办人
    factOwnership:
      allowedFacts:
        - Lead
        - Reservation
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
        - Payment
        - Deposit
        - LedgerEntry
        - DashboardSummary 写入
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.lead-reservation.v1
      missingEvidenceOutcome: NO_GO
    ledger:
      policyRef: ledger.none.v1
      ledgerEntryAllowed: false
    readSideOutputs:
      SearchResult: readonly
      Lens: readonly
      Projection: readonly
      Dashboard: readonly
    uiUxBoundary:
      currentWorkItemOnly: true
      readonlyCarryForward: true
      confirmPathOnly: true
      noInlineConfirm: true
    goNoGo:
      untilAllSatisfied: NO_GO
      finalDecisionOwner: artifacts/oam/final-report.json
  - packageId: check-in
    nameZh: 入住办理
    businessGoalZh: 基于预订或现场办理上下文确认入住人与床位占用。
    inScope:
      - Dorm.CheckinConfirm
      - Dorm.AccessCredentialIssue
    outOfScope:
      - 普通收款
      - 押金负债
      - 账务入账
      - Dashboard 写事实
    mainFlowZh:
      - 入住信息确认
      - 证件与协议核验
      - 门禁或入住凭证发放
    branchFlows:
      - 缺证件
      - 协议未确认
      - 床位不可用
      - 入住人与预订不一致
      - 人工复核
    fields:
      - fieldId: stay.residentIdentity
        displayNameZh: 入住人身份
        type: object
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.CheckinConfirm
        fallbackAllowed: false
        validationRules:
          - 身份信息必须通过证据核验。
        evidenceRequirements:
          - identity-proof
      - fieldId: stay.bedAssignment
        displayNameZh: 床位分配
        type: object
        category: readonly-carry-forward
        editable: false
        source: handoff
        truthOwner: Dorm.BedSetupConfirm
        fallbackAllowed: false
        validationRules:
          - 只能从上游已确认床位继承。
        evidenceRequirements:
          - room-link-proof
      - fieldId: stay.agreementAccepted
        displayNameZh: 入住协议确认
        type: boolean
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.CheckinConfirm
        fallbackAllowed: false
        validationRules:
          - 必须为已确认。
        evidenceRequirements:
          - agreement-proof
    handoff:
      produces:
        - Stay
        - AccessCredential
        - EvidenceObject
      enablesNext:
        - ordinary-payment
        - deposit-liability
        - service-task
        - bed-transfer-extend
      carryForwardReadonly:
        - stay.residentIdentity
        - stay.bedAssignment
        - stay.agreementAccepted
      nextAdmission: admission.dormitory.ordinary-payment.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 财务经办人
    factOwnership:
      allowedFacts:
        - Stay
        - AccessCredential
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
        - Payment
        - Deposit
        - LedgerEntry
        - DashboardSummary 写入
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.check-in.v1
      missingEvidenceOutcome: NO_GO
    ledger:
      policyRef: ledger.none.v1
      ledgerEntryAllowed: false
    readSideOutputs:
      SearchResult: readonly
      Lens: readonly
      Projection: readonly
      Dashboard: readonly
    uiUxBoundary:
      currentWorkItemOnly: true
      readonlyCarryForward: true
      confirmPathOnly: true
      noInlineConfirm: true
    goNoGo:
      untilAllSatisfied: NO_GO
      finalDecisionOwner: artifacts/oam/final-report.json
  - packageId: ordinary-payment
    nameZh: 普通收款
    businessGoalZh: 收集普通收款意向和收款凭证，并移交财务内核判断。
    inScope:
      - Dorm.PaymentConfirm
    outOfScope:
      - 押金负债
      - 直接写 LedgerEntry
      - Dashboard 写事实
    mainFlowZh:
      - 应收摘要只读带入
      - 收款凭证提交
      - 财务内核复核
    branchFlows:
      - 金额缺失
      - 收款凭证缺失
      - 金额与应收不一致
      - 财务拒绝
      - 人工复核
    fields:
      - fieldId: payment.receiptEvidence
        displayNameZh: 收款凭证
        type: evidenceRef
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.PaymentConfirm
        fallbackAllowed: false
        validationRules:
          - 必须绑定可核验证据。
        evidenceRequirements:
          - payment-receipt-proof
      - fieldId: payment.amountIntent
        displayNameZh: 收款金额意向
        type: money
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.PaymentConfirm
        fallbackAllowed: false
        validationRules:
          - 金额必须大于零。
        evidenceRequirements:
          - payment-amount-proof
    handoff:
      produces:
        - PaymentIntent
        - EvidenceObject
      enablesNext:
        - period-review
      carryForwardReadonly:
        - stay.residentIdentity
        - payment.receiptEvidence
        - payment.amountIntent
      nextAdmission: admission.finance.payment-review.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 非授权财务确认
    factOwnership:
      allowedFacts:
        - PaymentIntent
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
        - Payment
        - Deposit
        - LedgerEntry
        - DashboardSummary 写入
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.ordinary-payment.v1
      missingEvidenceOutcome: NO_GO
    ledger:
      policyRef: finance.kernel.required.v1
      ledgerEntryAllowed: false
      handoffToFinanceKernel: true
    readSideOutputs:
      SearchResult: readonly
      Lens: readonly
      Projection: readonly
      Dashboard: readonly
    uiUxBoundary:
      currentWorkItemOnly: true
      readonlyCarryForward: true
      confirmPathOnly: true
      noInlineConfirm: true
    goNoGo:
      untilAllSatisfied: NO_GO
      finalDecisionOwner: artifacts/oam/final-report.json
  - packageId: deposit-liability
    nameZh: 押金负债
    businessGoalZh: 押金只形成财务内核可验证负债，不由宿舍域直接入账。
    inScope:
      - Dorm.DepositConfirm
    outOfScope:
      - 押金作为收入
      - 直接写 LedgerEntry
      - Dashboard 写事实
    mainFlowZh:
      - 押金意向确认
      - 押金凭证提交
      - 财务内核负债复核
    branchFlows:
      - 押金金额缺失
      - 凭证缺失
      - 押金超额
      - 财务拒绝
      - 纠错
    fields:
      - fieldId: deposit.amountIntent
        displayNameZh: 押金金额意向
        type: money
        category: required-current-input
        editable: true
        source: currentWorkItem
        truthOwner: Dorm.DepositConfirm
        fallbackAllowed: false
        validationRules:
          - 金额必须大于零且不得标记为收入。
        evidenceRequirements:
          - deposit-receipt-proof
      - fieldId: deposit.liabilityTarget
        displayNameZh: 押金负债对象
        type: objectRef
        category: readonly-carry-forward
        editable: false
        source: handoff
        truthOwner: Finance.DepositReview
        fallbackAllowed: false
        validationRules:
          - 只能由财务内核确认。
        evidenceRequirements:
          - finance-review-proof
    handoff:
      produces:
        - DepositIntent
        - EvidenceObject
      enablesNext:
        - checkout-settlement
        - period-review
      carryForwardReadonly:
        - stay.residentIdentity
        - deposit.amountIntent
      nextAdmission: admission.finance.deposit-review.prepare.v1
    roles:
      allowed:
        - 宿舍经办人
        - 宿舍负责人
      denied:
        - 非授权财务确认
    factOwnership:
      allowedFacts:
        - DepositIntent
        - EvidenceObject
        - DomainEvent
        - CommandSubmission
      forbiddenFacts:
        - Deposit
        - Payment
        - LedgerEntry
        - DashboardSummary 写入
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.deposit-liability.v1
      missingEvidenceOutcome: NO_GO
    ledger:
      policyRef: finance.kernel.required.v1
      ledgerEntryAllowed: false
      handoffToFinanceKernel: true
    readSideOutputs:
