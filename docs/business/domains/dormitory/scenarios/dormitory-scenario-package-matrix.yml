        - Deposit
        - LedgerEntry
        - DashboardSummary 写入
    admission:
      policyRef: dormitory_l1_internal_pilot_observation
      productionConfirmAllowed: false
    evidence:
      policyRef: evidence.dormitory.service-task.v1
      missingEvidenceOutcome: NO_GO
    ledger:
      policyRef: ledger.none.v1
      ledgerEntryAllowed: false
    readSideOutputs:
      SearchResult: readonly
      Lens: readonly
      Projection: readonly
      Dashboard: readonly
    uiUxBoundary:
      currentWorkItemOnly: true
      readonlyCarryForward: true
      confirmPathOnly: true
      noInlineConfirm: true
    goNoGo:
      untilAllSatisfied: NO_GO
      finalDecisionOwner: artifacts/oam/final-report.json
  - packageId: expense-governance
    nameZh: 支出治理
    businessGoalZh: 记录支出申请和治理审批，支出入账只能移交财务内核。
    inScope:
