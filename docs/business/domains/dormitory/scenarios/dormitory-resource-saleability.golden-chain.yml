        - CommandSubmission
        - EvidenceObject
        - Outbox
      rawDomainEventReadAllowed: false
      rawCommandSubmissionReadAllowed: false
    requiredFields:
      - metricId
      - definitionVersion
      - maturityScope
      - permission
      - lineage
      - freshness
