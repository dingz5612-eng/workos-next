    consumesOnly:
      - SearchIndexRecord
      - OamObjectEnvelope
      - generatedReadModel
    writeThroughSearchAllowed: false
    visibilityDoesNotImplyConfirmAllowed: true
    requiresPermissionEnvelope: true
    requiresLineageEnvelope: true
    requiresFreshnessEnvelope: true
    forbiddenAvailableActions:
      - confirm
      - writeBusinessFact
      - productionConfirm
  missingEnvelopeBehavior:
    permissionMissing:
      resultVisibility: HIDDEN
      rankable: false
      actionable: false
    lineageMissing:
      authoritative: false
      metricEligible: false
      dashboardEligible: false
    freshnessMissing:
      stale: true
      freshnessStatus: UNKNOWN
      metricEligible: false
      dashboardEligible: false
    admissionMissing:
      visibleAllowed: true
      prepareAllowed: false
      confirmAllowed: false
      productionAllowed: false
