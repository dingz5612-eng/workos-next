    {"id":"finance-correction-003","statement":"correction appends reversal or compensation LedgerTransaction","severity":"P0"},
    {"id":"finance-correction-004","statement":"correction rebuilds affected ledger projections","severity":"P0"}
  ],
  "runtimeService": "LedgerProjectionRebuilder"
}
