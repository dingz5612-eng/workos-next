{
  "version": "oam.finance.ledger-transaction-contract.v1",
  "owner": "MoneyKernelPack",
  "transactionRequiredFields": [
    "tenantId",
    "ledgerTransactionId",
    "caseId",
    "workItemId",
    "submissionId",
    "currency",
    "balanceStatus",
    "transactionType"
  ],
  "entryRequiredFields": [
    "tenantId",
    "entryId",
    "ledgerTransactionId",
    "debitCredit",
    "amount",
    "currency",
    "accountId",
    "accountType",
    "entryRole"
  ],
  "invariants": [
    "借方合计必须等于贷方合计。",
    "所有分录必须引用同一个 LedgerTransaction。",
    "所有分录必须使用与交易相同的币种。",
    "金额必须为正数。",
    "balanceStatus 必须为 balanced。"
  ],
  "mutationPolicy": {
    "updateLedgerEntryAllowed": false,
    "deleteLedgerEntryAllowed": false,
    "correctionMode": "append_only_reversal_or_compensation"
  }
}
