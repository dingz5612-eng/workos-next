{
  "policyId": "business.admission-policy",
  "policyType": "admission",
  "version": "oam.policy.v1",
  "owner": "ReleaseControl",
  "sourceDirectory": "docs/business/admission",
  "runtimeBinding": {
    "loader": "BusinessAdmissionPolicyLoader",
    "evaluator": "AdmissionPolicyEvaluator",
    "guard": "BusinessLineAdmissionGuard"
  },
  "rules": {
    "l0ProductionConfirmAllowed": false,
    "l1ProductionConfirmAllowed": false,
    "requiresAdmissionRecord": true,
    "missingAdmissionBehavior": {
      "visibleAllowed": true,
      "prepareAllowed": false,
      "confirmAllowed": false,
      "productionAllowed": false,
      "mode": "contract_preview",
      "reason": "missing_admission_contract"
    },
    "requiresProductionAllowedTrueForProductionConfirm": true,
    "pageSpecificWriteApisAllowed": false,
    "productionWriteRoutesAllowedWhenL0": false
  },
  "gateBinding": {
    "gateInput": "businessLineAdmissionResult",
    "failureSeverity": "P0"
  }
}
