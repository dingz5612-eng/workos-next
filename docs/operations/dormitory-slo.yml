{
  "contractId": "oam-07-dormitory-slo-control-loop",
  "businessLine": "Dormitory",
  "stage": "OAM-07",
  "status": "active",
  "productionAllowed": false,
  "l2ProductionAllowed": false,
  "businessProductionAllowed": false,
  "observationWindowRef": "docs/go-live/dormitory/observation-window.yml",
  "metricContractRef": "docs/go-live/dormitory/observation-metric-contract.yml",
  "requiredCleanDaysForL2Candidate": 7,
  "neverAutoUpgradeToL2": true,
  "finalSystemGateBlockedMeansNoProductionGo": true,
  "slos": [
    { "id": "p0_stop_count", "label": "P0 stop count", "source": "ObservationDay", "unit": "count", "window": "daily", "dimension": "businessLine", "target": 0, "holdThreshold": 0, "stopThreshold": 1, "owner": "releaseOwner" },
    { "id": "p1_hold_count", "label": "P1 hold count", "source": "ObservationDay", "unit": "count", "window": "daily", "dimension": "businessLine", "target": 0, "holdThreshold": 1, "stopThreshold": 3, "owner": "operations" },
    { "id": "finance_daily_close", "label": "finance daily close", "source": "FinanceDailyClose", "unit": "status", "window": "daily", "dimension": "tenant", "target": "passed", "holdThreshold": "not_passed", "stopThreshold": "failed", "owner": "finance" },
    { "id": "deposit_liability_mismatch", "label": "deposit liability mismatch", "source": "FinanceTruth", "unit": "count", "window": "daily", "dimension": "tenant", "target": 0, "holdThreshold": 0, "stopThreshold": 1, "owner": "finance" },
    { "id": "duplicate_ledger_entry", "label": "duplicate ledger entry", "source": "LedgerReplay", "unit": "count", "window": "daily", "dimension": "tenant", "target": 0, "holdThreshold": 0, "stopThreshold": 1, "owner": "finance" },
    { "id": "evidence_missing_rate", "label": "evidence missing rate", "source": "EvidencePolicy", "unit": "ratio", "window": "daily", "dimension": "workItemType", "target": 0.01, "holdThreshold": 0.02, "stopThreshold": 0.1, "owner": "operations" },
    { "id": "evidence_rejected_rate", "label": "evidence rejected rate", "source": "EvidenceTrust", "unit": "ratio", "window": "daily", "dimension": "workItemType", "target": 0.01, "holdThreshold": 0.03, "stopThreshold": 0.1, "owner": "admin" },
    { "id": "evidence_upload_failure_rate", "label": "evidence upload failure rate", "source": "EvidenceUploadQueue", "unit": "ratio", "window": "daily", "dimension": "device", "target": 0, "holdThreshold": 0.01, "stopThreshold": 0.05, "owner": "admin" },
    { "id": "wrong_scope_evidence_count", "label": "wrong-scope evidence count", "source": "EvidenceTrust", "unit": "count", "window": "daily", "dimension": "tenant", "target": 0, "holdThreshold": 0, "stopThreshold": 1, "owner": "admin" },
    { "id": "projection_lag_p95", "label": "projection lag p95", "source": "ProjectionCheckpoint", "unit": "minutes", "window": "daily", "dimension": "lens", "target": 2, "holdThreshold": 5, "stopThreshold": 15, "owner": "runtime" },
    { "id": "sla_overdue", "label": "SLA overdue", "source": "WorkItemLifecycle", "unit": "count", "window": "daily", "dimension": "ownerRole", "target": 0, "holdThreshold": 1, "stopThreshold": 5, "owner": "manager" },
    { "id": "403_409_422_rate", "label": "403 / 409 / 422 rate", "source": "CommandSubmission", "unit": "ratio", "window": "daily", "dimension": "responseStatus", "target": 0.1, "holdThreshold": 0.2, "stopThreshold": 0.4, "owner": "operations" },
    { "id": "idempotency_conflict_no_side_effect", "label": "idempotency conflict no side effect", "source": "RuntimeProof", "unit": "boolean", "window": "daily", "dimension": "submission", "target": true, "holdThreshold": false, "stopThreshold": false, "owner": "runtime" },
    { "id": "bstage_gate_status", "label": "BStageGate status", "source": "BStageGateResult", "unit": "status", "window": "daily", "dimension": "gate", "target": "passed", "holdThreshold": "warning", "stopThreshold": "red", "owner": "releaseOwner" },
    { "id": "shadow_compare_status", "label": "ShadowCompare status", "source": "ShadowCompareReport", "unit": "status", "window": "daily", "dimension": "slice", "target": "green", "holdThreshold": "yellow", "stopThreshold": "red", "owner": "releaseOwner" },
    { "id": "invariant_status", "label": "Invariant status", "source": "RuntimeInvariantCheck", "unit": "status", "window": "daily", "dimension": "slice", "target": "passed", "holdThreshold": "warning", "stopThreshold": "failed", "owner": "releaseOwner" },
    { "id": "rollback_readiness", "label": "rollback readiness", "source": "RollbackDrill", "unit": "status", "window": "daily", "dimension": "slice", "target": "green", "holdThreshold": "yellow", "stopThreshold": "red", "owner": "releaseOwner" },
    { "id": "training_blocking_issues", "label": "training blocking issues", "source": "TrainingSignoff", "unit": "count", "window": "daily", "dimension": "role", "target": 0, "holdThreshold": 1, "stopThreshold": 3, "owner": "releaseOwner" },
    { "id": "support_tickets", "label": "support tickets", "source": "SupportDesk", "unit": "count", "window": "daily", "dimension": "category", "target": 2, "holdThreshold": 5, "stopThreshold": 10, "owner": "support" }
  ],
  "p0StopControls": [
    { "label": "money mismatch red", "owner": "finance", "action": "pause_money_confirm_and_open_finance_case", "recoveryCondition": "finance daily close replay green and mismatch corrected by append-only compensation" },
    { "label": "duplicate ledger entry", "owner": "finance", "action": "freeze_money_commands_and_run_ledger_replay", "recoveryCondition": "duplicate side effect count returns to zero" },
    { "label": "unbalanced ledger transaction", "owner": "finance", "action": "pause finance close and block affected commands", "recoveryCondition": "all LedgerTransaction rows balance after replay" },
    { "label": "deposit as revenue", "owner": "finance", "action": "pause deposit receipt confirm and append semantic correction", "recoveryCondition": "deposit liability posting contract passes" },
    { "label": "refund over liability", "owner": "finance", "action": "disable refund approve", "recoveryCondition": "available liability projection rebuilt and refund boundary passes" },
    { "label": "bed double occupancy", "owner": "operations", "action": "pause bed assignment WorkItem type", "recoveryCondition": "BedOccupancyInterval invariant passes" },
    { "label": "evidence leak", "owner": "admin", "action": "revoke signed URLs and audit exposed evidence", "recoveryCondition": "EvidenceTenantIsolationTests pass and leak count is zero" },
    { "label": "wrong tenant evidence", "owner": "admin", "action": "block affected evidence attachments", "recoveryCondition": "wrong-scope evidence confirm returns 403 or 422" },
    { "label": "device trust bypass", "owner": "admin", "action": "revoke device and disable high-risk confirm", "recoveryCondition": "revoked and untrusted device tests pass" },
    { "label": "unable to rollback", "owner": "releaseOwner", "action": "pause pilot and run rollback drill", "recoveryCondition": "rollback readiness returns green" },
    { "label": "finance daily close failed", "owner": "finance", "action": "hold daily review and open FinanceCase", "recoveryCondition": "daily close result is passed" },
    { "label": "BStageGate red", "owner": "releaseOwner", "action": "pause pilot and rerun BStageGateRunner", "recoveryCondition": "BStageGate status passed" },
    { "label": "Red ShadowCompareReport", "owner": "releaseOwner", "action": "hold affected slice and run shadow compare replay", "recoveryCondition": "ShadowCompare status green" },
    { "label": "unresolved P0 invariant", "owner": "releaseOwner", "action": "pause affected WorkItem types", "recoveryCondition": "P0 invariant count is zero" }
  ],
  "p1HoldControls": [
    { "label": "projection lag above threshold", "owner": "runtime", "dailyReviewAction": "检查 projection checkpoint lag 并重跑 rebuild" },
    { "label": "evidence upload failure above threshold", "owner": "admin", "dailyReviewAction": "检查 UploadQueue recovery 和设备网络状态" },
    { "label": "evidence missing rate above threshold", "owner": "operations", "dailyReviewAction": "检查 requiredEvidence copy 和 WorkItem training" },
    { "label": "rejected 422 abnormal", "owner": "operations", "dailyReviewAction": "复盘 blocker 分布并更新 nextAction" },
    { "label": "finance case backlog above threshold", "owner": "finance", "dailyReviewAction": "安排 FinanceCase 日清清理" },
    { "label": "unclear money backlog above threshold", "owner": "finance", "dailyReviewAction": "安排 UnclearMoneyCase 澄清" },
    { "label": "SLA overdue above threshold", "owner": "manager", "dailyReviewAction": "升级超时 WorkItem owner" },
    { "label": "training blocking issue open", "owner": "releaseOwner", "dailyReviewAction": "安排角色补训和签收复查" },
    { "label": "support ticket spike", "owner": "support", "dailyReviewAction": "按根因分类处理 support ticket spike" }
  ]
}
