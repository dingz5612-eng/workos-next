{
  "version": "rtf.metric-deviation-policy.v1",
  "stage": "RT-F",
  "summaryZh": "每个经营指标都必须声明来源、新鲜度、owner、过期策略、纠错 WorkItem 和冻结策略；偏差必须生成 RiskSignal。",
  "metrics": [
    {"metricId":"salableBedNightConversionEfficiency","source":"LeadFunnelLens","freshness":"15m","owner":"Dormitory Operations Owner","stalePolicy":"freezeLensAndCreateCorrectionWorkItem","correctionWorkItem":"Dorm.PeriodReview","freezePolicy":"freezeUntilSourceReplay","deviationRiskSignal":"risk-salable-bed-night-conversion-drop"},
    {"metricId":"checkinProcessingDuration","source":"StayOnboardingLens","freshness":"15m","owner":"Front Desk Lead","stalePolicy":"freezeLensAndCreateCorrectionWorkItem","correctionWorkItem":"Dorm.CheckinConfirm","freezePolicy":"freezeUntilWorkItemTraceVerified","deviationRiskSignal":"risk-checkin-duration-breach"},
    {"metricId":"checkoutTurnoverDuration","source":"CheckoutTurnoverLens","freshness":"15m","owner":"Checkout Coordinator","stalePolicy":"freezeLensAndCreateCorrectionWorkItem","correctionWorkItem":"Dorm.ResourceRelease","freezePolicy":"freezeUntilCleaningAndSettlementTrace","deviationRiskSignal":"risk-checkout-turnover-breach"},
    {"metricId":"serviceTaskCompletionDuration","source":"ServiceTaskLens","freshness":"15m","owner":"Service Lead","stalePolicy":"freezeLensAndCreateCorrectionWorkItem","correctionWorkItem":"Dorm.ServiceTaskComplete","freezePolicy":"freezeUntilServiceEvidenceVerified","deviationRiskSignal":"risk-service-task-duration-breach"},
    {"metricId":"unconfirmedPaymentAmount","source":"StayBalanceLens","freshness":"5m","owner":"Finance Supervisor","stalePolicy":"freezeMoneyLensAndCreateFinanceCase","correctionWorkItem":"Dorm.PaymentConfirm","freezePolicy":"freezeUntilLedgerProjectionRebuild","deviationRiskSignal":"risk-unconfirmed-payment-high"},
    {"metricId":"depositLiabilityAccuracy","source":"DepositLiabilityLens","freshness":"5m","owner":"Finance Supervisor","stalePolicy":"freezeMoneyLensAndCreateFinanceCase","correctionWorkItem":"Dorm.DepositConfirm","freezePolicy":"freezeUntilLedgerProjectionRebuild","deviationRiskSignal":"risk-deposit-liability-mismatch"},
    {"metricId":"outstandingBalance","source":"StayBalanceLens","freshness":"5m","owner":"Finance Supervisor","stalePolicy":"freezeMoneyLensAndCreateFinanceCase","correctionWorkItem":"Dorm.ChargeGenerate","freezePolicy":"freezeUntilLedgerProjectionRebuild","deviationRiskSignal":"risk-outstanding-balance-stale"},
    {"metricId":"reconciliationExceptionRate","source":"ExceptionRiskLens","freshness":"15m","owner":"Finance Controller","stalePolicy":"createCorrectionWorkItemAndBlockClose","correctionWorkItem":"Dorm.ExceptionResolve","freezePolicy":"freezePeriodCloseUntilResolved","deviationRiskSignal":"risk-reconciliation-exception-rate-high"},
    {"metricId":"evidenceMissingRate","source":"EvidenceTrustLens","freshness":"15m","owner":"Admin","stalePolicy":"createCorrectionWorkItemAndBlockConfirm","correctionWorkItem":"Dorm.ExceptionResolve","freezePolicy":"freezeConfirmUntilEvidenceResolved","deviationRiskSignal":"risk-evidence-missing-rate-high"},
    {"metricId":"duplicateConfirmRate","source":"CommandSubmission","freshness":"5m","owner":"Runtime Owner","stalePolicy":"createRuntimeCorrectionWorkItem","correctionWorkItem":"Dorm.ExceptionResolve","freezePolicy":"freezeDuplicateSideEffectUntilTraceVerified","deviationRiskSignal":"risk-duplicate-confirm-rate-high"},
    {"metricId":"blockedBedDays","source":"DormAvailabilityLens","freshness":"15m","owner":"Resource Manager","stalePolicy":"createCorrectionWorkItemAndEscalate","correctionWorkItem":"Dorm.BedAvailabilityConfirm","freezePolicy":"freezeAvailabilityUntilRoomReadinessTrace","deviationRiskSignal":"risk-blocked-bed-days-high"},
    {"metricId":"overdueTaskCount","source":"WorkQueueLens","freshness":"15m","owner":"Dormitory Operations Owner","stalePolicy":"createEscalationWorkItem","correctionWorkItem":"Dorm.ExceptionResolve","freezePolicy":"freezeSlaScoreUntilLifecycleTrace","deviationRiskSignal":"risk-overdue-task-count-high"},
    {"metricId":"exceptionClosureRate","source":"ExceptionRiskLens","freshness":"15m","owner":"Operations Director","stalePolicy":"createCorrectionWorkItemAndEscalate","correctionWorkItem":"Dorm.ExceptionResolve","freezePolicy":"freezeExceptionScoreUntilResolutionEvent","deviationRiskSignal":"risk-exception-closure-rate-low"},
    {"metricId":"slaAchievementRate","source":"WorkQueueLens","freshness":"15m","owner":"Dormitory Operations Owner","stalePolicy":"createPeriodReviewWorkItem","correctionWorkItem":"Dorm.PeriodReview","freezePolicy":"freezeSlaScoreUntilPeriodReview","deviationRiskSignal":"risk-sla-achievement-rate-low"},
    {"metricId":"periodActionCompletionRate","source":"PeriodReview","freshness":"1d","owner":"Dormitory Operations Owner","stalePolicy":"createPeriodReviewWorkItem","correctionWorkItem":"Dorm.PeriodReview","freezePolicy":"freezePeriodResultUntilActionPlanReviewed","deviationRiskSignal":"risk-period-action-completion-low"}
  ],
  "deviationRules": [
    {"ruleId":"dev-money-red","metricIds":["unconfirmedPaymentAmount","depositLiabilityAccuracy","outstandingBalance"],"severity":"P0","createsRiskSignal":true,"riskSignalType":"finance-control-risk"},
    {"ruleId":"dev-operations-sla","metricIds":["checkinProcessingDuration","checkoutTurnoverDuration","serviceTaskCompletionDuration","overdueTaskCount","slaAchievementRate"],"severity":"P1","createsRiskSignal":true,"riskSignalType":"sla-control-risk"},
    {"ruleId":"dev-evidence-audit","metricIds":["evidenceMissingRate","duplicateConfirmRate"],"severity":"P0","createsRiskSignal":true,"riskSignalType":"evidence-audit-risk"},
    {"ruleId":"dev-period-improvement","metricIds":["exceptionClosureRate","periodActionCompletionRate","salableBedNightConversionEfficiency","blockedBedDays","reconciliationExceptionRate"],"severity":"P1","createsRiskSignal":true,"riskSignalType":"period-improvement-risk"}
  ]
}
