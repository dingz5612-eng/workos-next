{
  "policyId": "dorm-l1-observation-incident-policy",
  "status": "active",
  "productionAllowed": false,
  "p0StopResponse": {
    "decision": "pause_or_rollback",
    "responseTime": "15m",
    "actions": [
      "pause_dormitory_pilot",
      "disable_money_confirm",
      "disable_refund_approve",
      "freeze_high_risk_workitem_types",
      "append_compensation_if_money_impact",
      "create_corrective_workitem",
      "notify_release_owner"
    ],
    "ledgerRule": "rollback 不删除账本，只允许 append-only compensation。",
    "factRule": "pause / rollback 不删除 DomainEvent 或 CommandSubmission。"
  },
  "p1HoldResponse": {
    "decision": "hold_and_fix",
    "responseTime": "4h",
    "actions": [
      "assign_owner",
      "create_or_update_workitem",
      "set_due_at",
      "daily_review_until_green"
    ]
  },
  "continueResponse": {
    "decision": "continue_l1_observation",
    "responseTime": "daily_review",
    "actions": [
      "record_daily_observation_result",
      "keep_l1_scope_frozen",
      "keep_l2_upgrade_gate_not_eligible_until_separate_stage"
    ]
  },
  "forbiddenOutcomes": [
    "Dormitory L2 Production allowed",
    "Business Production GO",
    "Repair production allowed",
    "Parts production allowed",
    "HR production allowed"
  ],
  "owners": {
    "releaseOwner": "releaseOwner",
    "financeOwner": "finance",
    "operationsOwner": "Dormitory Operations Owner",
    "technicalOwner": "Runtime Owner",
    "supportOwner": "Support Owner"
  }
}
