{
  "contractId": "dorm-l1-observation-metric-contract",
  "status": "active",
  "businessLine": "Dormitory",
  "productionAllowed": false,
  "thresholds": {
    "evidenceMissingRateMax": 0.02,
    "evidenceRejectedRateMax": 0.03,
    "evidenceUploadFailureRateMax": 0.01,
    "projectionLagP95MaxMinutes": 5,
    "slaOverdueMax": 0,
    "forbidden403RateMax": 0.15,
    "idempotency409RateMax": 0.05,
    "businessBlocked422RateMax": 0.2,
    "financeCaseBacklogMax": 3,
    "unclearMoneyBacklogMax": 2,
    "supportTicketSpikeMax": 5
  },
  "requiredDailyChecks": [
    "P0 stop count",
    "P1 hold count",
    "finance daily close",
    "deposit liability mismatch",
    "duplicate ledger entry",
    "evidence missing rate",
    "evidence rejected rate",
    "evidence upload failure rate",
    "wrong-scope evidence count",
    "projection lag p95",
    "SLA overdue",
    "403 / 409 / 422 rate",
    "idempotency conflict no side effect",
    "BStageGate status",
    "ShadowCompare status",
    "Invariant status",
    "rollback readiness",
    "training blocking issues",
    "support tickets"
  ],
  "p0StopMetrics": [
    { "id": "money_mismatch_red", "label": "money mismatch red", "owner": "finance", "source": "SemanticShadow / FinanceClose", "triggerWhen": "redCount > 0" },
    { "id": "duplicate_ledger_entry", "label": "duplicate ledger entry", "owner": "finance", "source": "LedgerTransaction replay", "triggerWhen": "count > 0" },
    { "id": "unbalanced_ledger_transaction", "label": "unbalanced ledger transaction", "owner": "finance", "source": "LedgerTransaction replay", "triggerWhen": "count > 0" },
    { "id": "deposit_as_revenue", "label": "deposit as revenue", "owner": "finance", "source": "FinanceTruth", "triggerWhen": "count > 0" },
    { "id": "refund_over_liability", "label": "refund over liability", "owner": "finance", "source": "DepositAccount", "triggerWhen": "count > 0" },
    { "id": "bed_double_occupancy", "label": "bed double occupancy", "owner": "operations", "source": "BedOccupancyInterval", "triggerWhen": "count > 0" },
    { "id": "evidence_leak", "label": "evidence leak", "owner": "admin", "source": "EvidenceTrust", "triggerWhen": "count > 0" },
    { "id": "wrong_tenant_evidence", "label": "wrong tenant evidence", "owner": "admin", "source": "EvidenceTrust", "triggerWhen": "count > 0" },
    { "id": "device_trust_bypass", "label": "device trust bypass", "owner": "admin", "source": "DeviceTrust", "triggerWhen": "count > 0" },
    { "id": "unable_to_rollback", "label": "unable to rollback", "owner": "releaseOwner", "source": "RollbackDrill", "triggerWhen": "status != green" },
    { "id": "finance_daily_close_failed", "label": "finance daily close failed", "owner": "finance", "source": "FinanceDailyClose", "triggerWhen": "status != passed" },
    { "id": "bstage_gate_red", "label": "BStageGate red", "owner": "releaseOwner", "source": "BStageGateResult", "triggerWhen": "status != passed" },
    { "id": "red_shadow_compare_report", "label": "Red ShadowCompareReport", "owner": "releaseOwner", "source": "ShadowCompareReport", "triggerWhen": "status == red" },
    { "id": "unresolved_p0_invariant", "label": "unresolved P0 invariant", "owner": "releaseOwner", "source": "RuntimeInvariantCheck", "triggerWhen": "count > 0" }
  ],
  "p1HoldMetrics": [
    { "id": "projection_lag_above_threshold", "label": "projection lag above threshold", "owner": "runtime", "source": "ProjectionCheckpoint", "thresholdRef": "projectionLagP95MaxMinutes" },
    { "id": "evidence_upload_failure_above_threshold", "label": "evidence upload failure above threshold", "owner": "admin", "source": "EvidenceUploadQueue", "thresholdRef": "evidenceUploadFailureRateMax" },
    { "id": "evidence_missing_rate_above_threshold", "label": "evidence missing rate above threshold", "owner": "operations", "source": "EvidencePolicy", "thresholdRef": "evidenceMissingRateMax" },
    { "id": "rejected_422_abnormal", "label": "rejected 422 abnormal", "owner": "operations", "source": "RejectedCommandSubmission", "thresholdRef": "businessBlocked422RateMax" },
    { "id": "finance_case_backlog_above_threshold", "label": "finance case backlog above threshold", "owner": "finance", "source": "FinanceCase", "thresholdRef": "financeCaseBacklogMax" },
    { "id": "unclear_money_backlog_above_threshold", "label": "unclear money backlog above threshold", "owner": "finance", "source": "UnclearMoneyCase", "thresholdRef": "unclearMoneyBacklogMax" },
    { "id": "sla_overdue_above_threshold", "label": "SLA overdue above threshold", "owner": "manager", "source": "WorkItem SLA", "thresholdRef": "slaOverdueMax" },
    { "id": "training_blocking_issue_open", "label": "training blocking issue open", "owner": "releaseOwner", "source": "TrainingSignoff", "threshold": 0 },
    { "id": "support_ticket_spike", "label": "support ticket spike", "owner": "support", "source": "SupportTickets", "thresholdRef": "supportTicketSpikeMax" }
  ]
}
