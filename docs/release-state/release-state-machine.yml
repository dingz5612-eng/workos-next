version: release-state-machine.v1
name: 发布与内测状态权威
language: zh-CN
authority:
  source: artifacts/release-state/current-state.json
  builder: scripts/release-state/build-current-release-state.mjs
  checker:
    - scripts/release-state/check-current-release-state.mjs
    - scripts/release-state/check-current-state-authority.mjs
allowedStates:
  dormitory:
    - L1_INTERNAL_PILOT_OBSERVATION
  businessProduction:
    - BLOCKED
  dormitoryL2:
    - BLOCKED
  repairPartsHr:
    - L0 Contract Preview
  finalSystemGate:
    - blocked
  bStageGate:
    - passed
prohibitedStates:
  - DORMITORY_L2_PRODUCTION_ALLOWED
  - BUSINESS_PRODUCTION_GO
  - REPAIR_PARTS_HR_PRODUCTION_ALLOWED
transitionRules:
  - id: dorm-int-go-maps-to-l1-observation
    description: DORM-INT GO 只能映射为 L1 内测观察窗口。
    from: GO_FOR_INTERNAL_PILOT
    to: L1_INTERNAL_PILOT_OBSERVATION
    requires:
      - internalPilotAllowed=true
      - productionAllowed=false
      - dormitoryL2ProductionAllowed=false
  - id: final-system-gate-blocks-business-production
    description: Final System Gate 仍 blocked 时，Business Production 必须保持 blocked。
    from: finalSystemGate=blocked
    to: businessProduction=BLOCKED
  - id: portfolio-lines-remain-isolated
    description: Repair / Parts / HR 不继承 Dormitory L1 状态。
    from: dormitory=L1_INTERNAL_PILOT_OBSERVATION
    to: repairPartsHr=L0 Contract Preview
evidenceRefs:
  - artifacts/go-live/dormitory/internal-pilot-go-no-go.json
  - artifacts/rt4/evidence-graph.json
  - artifacts/rt4/completion-dashboard.json
  - artifacts/rt4/final-completion-assurance-result.json
  - docs/business/business-line-registry.json
  - artifacts/go-live/dormitory/b-stage-gate-result.json
  - artifacts/go-live/dormitory/observation-window-result.json
  - artifacts/release-state/current-state.json
