name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"

jobs:
  oam-current:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workosnext_test
          POSTGRES_USER: workosnext
          POSTGRES_PASSWORD: workosnext_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U workosnext -d workosnext_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      WORKOS_TEST_CONNECTION: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
      ConnectionStrings__WorkOSRuntime: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
      TEST_DATABASE: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Install browser runtime
        run: npm --prefix apps/mobile exec playwright install --with-deps chromium

      - name: OAM purity check
        run: node scripts/oam/check-current-oam.mjs

      - name: Validate contracts
        run: |
          node scripts/validate-contracts.mjs
          node scripts/check-rule-authority.mjs
          node scripts/check-local-path-references.mjs

      - name: Validate API boundaries
        run: |
          node scripts/check-api-boundaries.mjs --self-test
          node scripts/check-api-boundaries.mjs
          node scripts/check-runtime-write-paths.mjs --self-test
          node scripts/check-runtime-write-paths.mjs

      - name: Validate current kernels
        run: |
          node scripts/check-admission-kernel.mjs --self-test
          node scripts/check-admission-kernel.mjs
          node scripts/check-business-line-admission.mjs
          node scripts/check-account-actor-kernel.mjs --self-test
          node scripts/check-account-actor-kernel.mjs
          node scripts/check-language-kernel.mjs
          node scripts/check-search-kernel.mjs --self-test
          node scripts/check-search-kernel.mjs

      - name: Validate policy as code
        run: |
          node scripts/check-policy-as-code.mjs --self-test
          node scripts/check-policy-as-code.mjs
          node scripts/check-domain-packs.mjs --self-test
          node scripts/check-domain-packs.mjs
          node scripts/check-truth-owners.mjs --self-test
          node scripts/check-truth-owners.mjs
          node scripts/check-finance-truth.mjs --self-test
          node scripts/check-finance-truth.mjs
          node scripts/check-ledger-semantic-rules.mjs
          node scripts/finance/check-finance-semantic-truth.mjs
          node scripts/check-management-cockpit-boundary.mjs --self-test
          node scripts/check-management-cockpit-boundary.mjs
          node scripts/check-shared-governance-boundary.mjs --self-test
          node scripts/check-shared-governance-boundary.mjs
          node scripts/check-dormitory-golden-domain.mjs --self-test
          node scripts/check-dormitory-golden-domain.mjs

      - name: Validate business semantic contracts
        run: |
          node scripts/business/check-scenario-field-contract.mjs
          node scripts/business/check-canonical-scenario-map.mjs
          node scripts/business/check-evidence-coverage-contract.mjs
          node scripts/business/check-ledger-posting-contract.mjs

      - name: Build mobile
        run: npm --prefix apps/mobile run build

      - name: Test mobile
        run: npm --prefix apps/mobile run test

      - name: Test PC
        run: npm --prefix apps/mobile run test:pc

      - name: Mobile coverage
        run: npm --prefix apps/mobile run test:coverage

      - name: Browser smoke
        run: npm --prefix apps/mobile run test:e2e

      - name: Build backend
        run: dotnet build WorkOSNext.sln -c Release

      - name: Backend unit tests
        run: dotnet test tests/WorkOS.UnitTests/WorkOS.UnitTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Runtime integration tests
        run: dotnet test tests/WorkOS.RuntimeIntegrationTests/WorkOS.RuntimeIntegrationTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Database security tests
        run: dotnet test tests/WorkOS.DatabaseSecurityTests/WorkOS.DatabaseSecurityTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Policy tests
        run: dotnet test tests/WorkOS.PolicyAsCodeTests/WorkOS.PolicyAsCodeTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Release control tests
        run: dotnet test tests/WorkOS.ReleaseEvidenceTests/WorkOS.ReleaseEvidenceTests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Runtime contract tests
        run: dotnet run --project tests/WorkOS.RuntimeContractTests/WorkOS.RuntimeContractTests.csproj -c Release

      - name: Diff whitespace check
        run: git diff --check
