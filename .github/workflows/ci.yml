name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
      - 'codex/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workosnext_test
          POSTGRES_USER: workosnext
          POSTGRES_PASSWORD: workosnext_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U workosnext -d workosnext_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Validate PR contract
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-contract.mjs --github-event

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Audit mobile dependencies
        run: npm --prefix apps/mobile audit --audit-level=low

      - name: Build mobile
        run: npm --prefix apps/mobile run build

      - name: Validate no production fake fallback
        run: |
          node scripts/check-no-production-fake-fallback.mjs --self-test
          node scripts/check-no-production-fake-fallback.mjs --dist

      - name: Test mobile
        run: npm --prefix apps/mobile run test

      - name: Build backend
        run: dotnet build WorkOSNext.sln -c Release

      - name: Run unit tests
        run: dotnet test tests/WorkOS.UnitTests/WorkOS.UnitTests.csproj -c Release --no-build

      - name: Run runtime integration tests
        run: dotnet test tests/WorkOS.RuntimeIntegrationTests/WorkOS.RuntimeIntegrationTests.csproj -c Release --no-build

      - name: Run database security tests
        env:
          WORKOS_TEST_CONNECTION: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          ConnectionStrings__WorkOSRuntime: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          TEST_DATABASE: "true"
        run: dotnet test tests/WorkOS.DatabaseSecurityTests/WorkOS.DatabaseSecurityTests.csproj -c Release --no-build

      - name: Run release evidence tests
        run: dotnet test tests/WorkOS.ReleaseEvidenceTests/WorkOS.ReleaseEvidenceTests.csproj -c Release --no-build

      - name: Run policy as code tests
        run: dotnet test tests/WorkOS.PolicyAsCodeTests/WorkOS.PolicyAsCodeTests.csproj -c Release --no-build

      - name: Run runtime contract tests
        env:
          WORKOS_TEST_CONNECTION: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          TEST_DATABASE: "true"
        run: dotnet run --project tests/WorkOS.RuntimeContractTests/WorkOS.RuntimeContractTests.csproj -c Release

      - name: Validate contract files
        run: node scripts/validate-contracts.mjs

      - name: Validate slice admission
        run: node scripts/validate-slice-admission.mjs

      - name: Architecture drift report
        run: node scripts/architecture-drift-report.mjs

      - name: Validate generated DTOs
        run: node scripts/generate-contract-dtos.mjs --check

      - name: Validate runtime API semantics
        env:
          ConnectionStrings__WorkOSRuntime: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
        run: node scripts/validate-runtime-api.mjs

      - name: Validate API boundaries
        run: |
          node scripts/check-api-boundaries.mjs --self-test
          node scripts/check-api-boundaries.mjs
          node scripts/check-runtime-write-paths.mjs --self-test
          node scripts/check-runtime-write-paths.mjs

      - name: Validate V5.5 rules OS
        run: node scripts/check-v5-5-rules-os.mjs --mode=ci --commitSha=${GITHUB_SHA} --ciRunId=${GITHUB_RUN_ID} --ciRunSha=${GITHUB_SHA} --v54RunId=ci-pending-${GITHUB_RUN_ID} --v54RunSha=${GITHUB_SHA}

      - name: Validate RT-2 BTOS compiler contracts
        run: |
          node scripts/check-truth-owners.mjs --self-test
          node scripts/check-truth-owners.mjs
          node scripts/check-domain-packs.mjs --self-test
          node scripts/check-domain-packs.mjs
          node scripts/check-provisional-ref-usage.mjs --self-test
          node scripts/check-provisional-ref-usage.mjs
          node scripts/check-receipt-projection.mjs --self-test
          node scripts/check-receipt-projection.mjs
          node scripts/check-management-cockpit-boundary.mjs --self-test
          node scripts/check-management-cockpit-boundary.mjs

      - name: Validate RT-2A shared governance boundary
        run: |
          node scripts/check-shared-governance-boundary.mjs --self-test
          node scripts/check-shared-governance-boundary.mjs

      - name: Validate RT-P policy as code
        run: |
          node scripts/check-admission-surface-alignment.mjs --self-test
          node scripts/check-admission-surface-alignment.mjs
          node scripts/check-policy-as-code.mjs --self-test
          node scripts/check-policy-as-code.mjs

      - name: Validate RT-3 finance truth production kernel
        run: |
          node scripts/check-finance-truth.mjs --self-test
          node scripts/check-finance-truth.mjs

      - name: Validate RT-S executable scenario factory
        run: |
          node scripts/check-executable-scenarios.mjs --self-test
          node scripts/check-executable-scenarios.mjs

      - name: Validate B1 Dormitory Domain Kit
        run: |
          node scripts/check-dormitory-domain-kit.mjs
          node scripts/check-business-domain-kit.mjs

      - name: Validate B3 Business Line Admission
        run: |
          node scripts/check-business-line-admission.mjs
          node scripts/check-domain-kit-usage.mjs

      - name: Certify B2 Dormitory Pilot
        run: node scripts/v5_4/certify-dormitory.mjs --sourceMode=real

      - name: Validate RT-B B-stage gate
        run: node scripts/v5_4/b-gate-runner.mjs

      - name: Validate RT-4 Dormitory Golden Domain
        run: node scripts/check-dormitory-golden-domain.mjs

      - name: Validate RT-5 Experience Contract
        run: |
          node scripts/check-experience-contract.mjs
          node scripts/check-surface-contract.mjs
          node scripts/check-no-mobile-pc-cross-import.mjs
          node scripts/check-mobile-visible-copy.mjs
          node scripts/check-no-raw-surface-labels.mjs
          node scripts/surface/check-surface-experience-contract.mjs
          node scripts/surface/check-mobile-pc-surface-boundary.mjs
          node scripts/surface/check-operational-copy-matrix.mjs
          node scripts/surface/check-mobile-visible-copy.mjs
          node scripts/surface/check-no-raw-surface-labels.mjs
          node scripts/surface/check-mobile-search-contract.mjs
          node scripts/surface/check-learning-center-contract.mjs
          node scripts/surface/check-queue-state-contract.mjs
          node scripts/surface/check-device-trust-contract.mjs
          node scripts/surface/check-evidence-trust-contract.mjs
          node scripts/surface/check-permission-explainability-contract.mjs
          node scripts/surface/check-operation-panel-runtime-contract.mjs
          node scripts/surface/check-surface-api-boundary.mjs
          node scripts/surface/check-surface-runtime-guard-contract.mjs

      - name: Validate RT-6 Operating Control Tower
        run: node scripts/check-operating-control-tower.mjs

      - name: Validate RT-F Operating Feedback Loop
        run: node scripts/check-operating-feedback-loop.mjs

      - name: Validate RT-FINAL Completion Assurance
        run: node scripts/rt4/check-final-completion-assurance.mjs

      - name: Validate OAM-00 Evidence Reconciliation
        if: github.event_name == 'pull_request'
        run: |
          node scripts/release-state/check-evidence-reconciliation.mjs
          node scripts/rt4/check-final-evidence-freshness.mjs

      - name: Validate OAM-01 Release State Authority
        if: github.event_name == 'pull_request'
        run: |
          node scripts/release-state/build-current-release-state.mjs
          node scripts/release-state/check-current-release-state.mjs
          node scripts/release-state/check-current-state-authority.mjs

      - name: Validate OAM-02 Business Semantic Contract Kernel
        if: github.event_name == 'pull_request'
        run: |
          node scripts/business/check-scenario-field-contract.mjs
          node scripts/business/check-canonical-scenario-map.mjs
          node scripts/business/check-evidence-coverage-contract.mjs
          node scripts/business/check-ledger-posting-contract.mjs
          node scripts/business/check-metric-formula-contract.mjs

      - name: Validate OAM-03 Runtime Proof Harness
        if: github.event_name == 'pull_request'
        env:
          ConnectionStrings__WorkOSRuntime: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          WORKOS_TEST_CONNECTION: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          TEST_DATABASE: "true"
        run: |
          node scripts/proof/run-runtime-proof.mjs
          node scripts/proof/check-runtime-proof-result.mjs

      - name: Validate OAM-04 Surface Twin-Plane Contract
        run: node scripts/surface/check-oam-04-surface-twin-plane-contract.mjs

      - name: Architecture guard
        shell: pwsh
        env:
          ConnectionStrings__WorkOSRuntime: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          WORKOS_TEST_CONNECTION: Host=localhost;Port=54329;Database=workosnext_test;Username=workosnext;Password=workosnext_dev
          TEST_DATABASE: "true"
        run: ./scripts/guard-architecture.ps1

      - name: Clean baseline gate
        shell: pwsh
        run: ./scripts/clean-baseline.ps1

      - name: Diff whitespace check
        run: git diff --check
